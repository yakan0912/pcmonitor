<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVGマップエディタ</title>
<!--
  SVGマップエディタ
    assets/parts の部品を置いて、Power BI ビジュアル用の SVG（assets/monitor.svg など）を作る。
    使い方: このファイルを Chrome / Edge で開く（サーバー不要）。
    ・部品を置くと要素ID（PC-013 など）を自動で振り、中の部品の名前（PC-013_screen_status-fill など）もそろえる
    ・「開く」で開いたファイルは「保存」でそのまま上書きできる（Chrome / Edge のみ。ほかのブラウザはダウンロード）
    ・作業中の内容はブラウザに自動で一時保存される
-->
<style>
  /* 色はここだけで決める（白 / 暗い の2種類） */
  /* color-scheme：スクロールバーや色を選ぶ画面など、ブラウザの部品もモードに合わせる */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --panel: #f7f8fa;
    --text: #111827;
    --muted: #4b5563;
    --faint: #9ca3af;
    --line: #d9dde3;
    --hover: #eceff3;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --accent-soft: #e3ecff;
    --danger: #dc2626;
    --ok: #15803d;
    --stage: #dfe2e7;
    --input: #ffffff;
    --shadow: 0 6px 24px rgba(15, 23, 42, .16);
    --checker-a: #ffffff;
    --checker-b: #e3e6ea;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1d2026;
    --panel: #23272e;
    --text: #eceef1;
    --muted: #b4bac4;
    --faint: #7c8491;
    --line: #363b45;
    --hover: #2e333b;
    --accent: #5b9bff;
    --accent-text: #0b1220;
    --accent-soft: #24344f;
    --danger: #f87171;
    --ok: #4ade80;
    --stage: #121418;
    --input: #181b20;
    --shadow: 0 6px 24px rgba(0, 0, 0, .5);
    --checker-a: #2f333b;
    --checker-b: #23262c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto auto 1fr;
    font-family: "Meiryo", "Yu Gothic UI", sans-serif;
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  /* ドラッグで文字が青く選ばれたり、文字の上で I 字のカーソルになったりしないように
     （文字を打てるのは入力欄だけ） */
  body { user-select: none; -webkit-user-select: none; }
  input, textarea { user-select: text; -webkit-user-select: text; }
  #canvas { cursor: default; }
  #canvas text { cursor: inherit; }

  /* アイコン（24 マスで描いた線のアイコン） */
  .ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* 入力欄と選択欄 */
  input[type=text], input[type=number], select, textarea {
    padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--input);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }

  /* ---------- 上の段：ファイル ---------- */
  #menubar {
    display: flex; align-items: center; gap: 4px;
    padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 10px; border: 1px solid transparent; border-radius: 6px; background: none;
  }
  .btn:hover:not(:disabled) { background: var(--hover); }
  .btn:disabled { color: var(--faint); cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-text); font-weight: bold; }
  .btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
  .sep { width: 1px; height: 24px; background: var(--line); margin: 0 6px; flex: none; }
  #fileName { margin-left: 8px; color: var(--muted); }
  #btnTheme { margin-left: auto; }

  /* ---------- 2段目：道具と表示 ---------- */
  #toolbar {
    display: flex; align-items: center; gap: 4px; overflow: hidden;
    padding: 6px 12px; background: var(--bg); border-bottom: 1px solid var(--line);
  }
  #toolbar > * { flex: none; }
  #toolbar > .spacer { flex: 1; }
  /* 入りきらないときは道具の名前を隠してアイコンだけにする（高さは変えない。名前はマウスを乗せると出る） */
  #toolbar.compact .tool { font-size: 0; gap: 0; min-width: 40px; padding: 0 6px; }
  #toolbar.compact .fieldLabel { display: none; }
  .group { display: flex; align-items: center; gap: 2px; }
  .tool {
    min-width: 52px; height: 50px; padding: 0 8px; white-space: nowrap;
    display: grid; place-items: center; align-content: center; gap: 3px;
    border: 1px solid transparent; border-radius: 8px; background: none; font-size: 12px; color: var(--muted);
  }
  .tool:hover { background: var(--hover); color: var(--text); }
  .tool.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: bold; }
  #toolOptions { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  #toolOptions:empty { display: none; }
  .field { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  .spacer { flex: 1; }

  /* 色 */
  #colorBox { position: relative; }
  #colorDirect { position: absolute; left: 0; bottom: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; border: 0; padding: 0; }
  #colorBox { display: flex; gap: 2px; }
  .colorBtn { height: 50px; padding: 0 10px; }
  .colorSwatch { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  /* 線の色は、太い枠で見せる */
  .colorSwatch.stroke { border: 5px solid; box-shadow: 0 0 0 1px var(--line); background: none; }
  .colorBtn.open { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  #colorPopTitle { margin: 0 0 10px; font-size: 13px; font-weight: bold; color: var(--muted); }
  /* 道具の段ははみ出しを隠すので、色の一覧は画面に対して置く（位置は開くときに決める） */
  #colorPop {
    position: fixed; z-index: 10;
    padding: 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  }
  #colorPop[hidden] { display: none; }
  #palette { display: grid; grid-template-columns: repeat(8, 26px); gap: 8px; }
  .swatch { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--faint); padding: 0; }
  .swatch.active { outline: 2px solid var(--accent); outline-offset: 2px; }
  #colorPop .custom { display: flex; align-items: center; gap: 8px; margin-top: 12px; color: var(--muted); }
  #colorCode { width: 96px; font-family: Consolas, monospace; text-transform: uppercase; }
  #colorCode.invalid { outline: 2px solid var(--danger); outline-offset: -1px; }
  #currentColor { width: 40px; height: 28px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); }

  /* 拡大 */
  #zoomBox { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  #zoomBox button { border: 0; background: none; padding: 6px 10px; display: grid; place-items: center; }
  #zoomBox button:hover { background: var(--hover); }
  #zoomLabel {
    width: 64px; padding: 6px 2px; border: 0; border-radius: 0; background: transparent;
    text-align: center; font-variant-numeric: tabular-nums;
  }
  #zoomLabel:hover { background: var(--hover); }

  /* オプション */
  #options { padding: 14px; }
  #options .hint { margin: 0 0 12px; }
  #selColors { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 12px; }
  #selColors button {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); text-align: left;
  }
  #selColors button:hover { background: var(--hover); }
  #selColors button.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); font-weight: bold; }
  #selColors i { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--faint); flex: none; }
  #selColorPick { width: 44px; height: 30px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); }

  /* ---------- 本体 ---------- */
  main { display: grid; grid-template-columns: 180px 1fr 300px; min-height: 0; }
  aside { overflow: auto; min-height: 0; background: var(--panel); }
  .heading { margin: 0 0 10px; font-size: 13px; font-weight: bold; color: var(--muted); }
  #items { border-right: 1px solid var(--line); padding: 12px; }
  .item {
    position: relative; display: grid; gap: 6px; padding: 8px; margin-bottom: 8px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; cursor: grab;
  }
  .item:hover { border-color: var(--accent); }
  .item.armed { border-color: var(--accent); background: var(--accent-soft); }
  /* 部品の見本：透明な所が分かるように市松模様にする */
  .item svg {
    width: 100%; height: 70px; border-radius: 4px;
    background-color: var(--checker-a);
    background-image: conic-gradient(var(--checker-b) 25%, transparent 0 50%, var(--checker-b) 0 75%, transparent 0);
    background-size: 12px 12px;
  }
  /* 線の種類（見本付きのボタン） */
  .lineStyles { display: flex; gap: 4px; }
  .lineStyles button {
    height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .lineStyles button:hover { background: var(--hover); color: var(--text); }
  .lineStyles button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: bold; }
  .lineStyles svg:not(.ic) { width: 32px; height: 14px; }
  #toolOptions input[type=number] { width: 52px; }
  .item span { font-size: 13px; text-align: center; }
  .item .remove {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; display: grid; place-items: center;
    border: 0; border-radius: 4px; background: var(--bg); color: var(--muted);
  }
  #addPart {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px; border: 1px dashed var(--line); border-radius: 8px; background: none; color: var(--muted);
  }
  #addPart:hover { border-color: var(--accent); color: var(--accent); }
  .hint { color: var(--muted); font-size: 13px; line-height: 1.7; margin: 12px 0 0; }

  #center { display: grid; grid-template-rows: 1fr auto; min-height: 0; min-width: 0; }
  #stage { overflow: auto; background: var(--stage); min-height: 0; }
  /* キャンバスの下の段 */
  #statusbar {
    display: flex; align-items: center; gap: 8px; padding: 4px 12px;
    background: var(--panel); border-top: 1px solid var(--line);
  }
  #coords { color: var(--muted); font-variant-numeric: tabular-nums; }
  #statusbar .tool { height: 32px; display: flex; gap: 6px; font-size: 13px; padding: 0 10px; }
  #statusbar #zoomBox button { padding: 4px 10px; }
  #stageInner { display: inline-block; padding: 40px; }
  #canvas { display: block; box-shadow: var(--shadow); background: #fff; }
  #canvas.cur-cross { cursor: crosshair; }
  #canvas.cur-text { cursor: text; }
  #canvas.cur-zoom { cursor: zoom-in; }
  #canvas.cur-zoom-out { cursor: zoom-out; }
  #canvas.cur-pick { cursor: cell; }

  #side { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  #tabs { display: flex; gap: 4px; padding: 0 10px; border-bottom: 1px solid var(--line); }
  .tab {
    border: 0; border-bottom: 2px solid transparent; margin-bottom: -1px;
    background: none; padding: 12px 10px 10px; color: var(--muted);
  }
  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: bold; }
  .panel { overflow: auto; min-height: 0; }
  .panel[hidden] { display: none; }
  #props { padding: 14px; }
  #props h3 { margin: 0 0 12px; font-size: 15px; }
  #props h4 { margin: 18px 0 8px; font-size: 13px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 8px; margin-bottom: 8px; }
  .row > span { color: var(--muted); }
  .row input[type=text], .row input[type=number], .row select, #props textarea { width: 100%; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pair .row { grid-template-columns: 46px 1fr; }
  .colorField { display: flex; gap: 6px; }
  .colorField input[type=color] { width: 36px; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: var(--input); }
  .warn { color: var(--danger); font-size: 13px; margin: 0 0 8px; line-height: 1.6; }
  .ok { color: var(--ok); font-size: 13px; margin: 0 0 8px; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 16px; }
  .actions button {
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 13px;
  }
  .actions button:hover { background: var(--hover); }
  .actions .danger { color: var(--danger); }
  .alignRow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .alignRow.two { grid-template-columns: 1fr 1fr; }
  .alignRow button {
    display: grid; justify-items: center; gap: 2px; padding: 6px 4px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 12px; color: var(--muted);
  }
  .alignRow button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
  .alignRow button:disabled { opacity: .4; cursor: default; }
  #props textarea { height: 120px; font-family: Consolas, monospace; font-size: 13px; resize: vertical; }

  #layers { padding: 12px; }
  #layers .hint { margin: 0 0 10px; }
  .layer {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer;
  }
  .layer:hover { background: var(--hover); }
  .layer.dragging { opacity: .45; }
  .layer.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .layer.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .layer.sel { background: var(--accent-soft); color: var(--accent); font-weight: bold; }
  .layer .lname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .layer .lock { border: 0; background: none; padding: 2px; display: grid; place-items: center; color: var(--faint); border-radius: 4px; }
  .layer .lock:hover { background: var(--hover); color: var(--text); }
  .layer .lock.on { color: var(--text); }
  .layer .lock .ic { width: 16px; height: 16px; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.show { opacity: 1; }
  #toast .chip { display: inline-block; width: 14px; height: 14px; margin-left: 6px; vertical-align: -2px; border-radius: 3px; border: 1px solid var(--faint); }
</style>
</head>
<body>

<header id="menubar">
  <button class="btn" id="btnNew" title="新しく作る">
    <svg class="ic" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg>新規
  </button>
  <button class="btn" id="btnOpen" title="SVG ファイルを開く">
    <svg class="ic" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>開く
  </button>
  <button class="btn primary" id="btnSave" title="保存（Ctrl+S）">
    <svg class="ic" viewBox="0 0 24 24"><path d="M5 3h11l4 4v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 1-2z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/></svg>保存
  </button>
  <button class="btn" id="btnSaveAs" title="名前を付けて保存（Ctrl+Shift+S）">名前を付けて保存</button>
  <span class="sep"></span>
  <button class="btn" id="btnUndo" title="元に戻す（Ctrl+Z）">
    <svg class="ic" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>元に戻す
  </button>
  <button class="btn" id="btnRedo" title="やりなおし（Ctrl+Y）">
    <svg class="ic" viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>やりなおし
  </button>
  <span id="fileName"></span>
  <button class="btn" id="btnTheme" title="ダークモード / ライトモード を切り替える"></button>
</header>

<div id="toolbar">
  <div class="group">
    <button class="tool" data-tool="select" title="選択・移動（V）">
      <svg class="ic" viewBox="0 0 24 24"><path d="M5 4l14 6-6 2-2 6z"/></svg>選択
    </button>
    <button class="tool" data-tool="line" title="線（L）：クリックで角を置く。部品や線に吸い付いた所（緑の丸）をクリックするとそこで終わる（Alt で続ける）。ダブルクリックか Enter でも終わる。Shift で斜め">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h5V6h5"/></svg>線
    </button>
    <button class="tool" data-tool="rect" title="四角（R）：ドラッグで描く">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>四角
    </button>
    <button class="tool" data-tool="ellipse" title="丸（O）：ドラッグで描く。Shift で正円">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/></svg>丸
    </button>
    <button class="tool" data-tool="text" title="文字（T）">
      <svg class="ic" viewBox="0 0 24 24"><path d="M5 7V5h14v2M12 5v14M9 19h6"/></svg>文字
    </button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <div id="colorBox">
      <button class="tool colorBtn" data-color-target="fill" title="塗り：これから描く四角・丸・文字の色。選んでいる図形があれば、その塗りも変わる。クリックで色の一覧、ダブルクリックで好きな色を選ぶ">
        <span class="colorSwatch" id="fillSwatch"></span>塗り
      </button>
      <button class="tool colorBtn" data-color-target="stroke" title="線：これから描く線の色。選んでいる線や、枠線のある四角・丸があれば、その線も変わる。クリックで色の一覧、ダブルクリックで好きな色を選ぶ">
        <span class="colorSwatch stroke" id="strokeSwatch"></span>線
      </button>
      <!-- ダブルクリックで開く色の選択（見えないが、色を選ぶ画面がボタンの近くに出るようにここに置く） -->
      <input type="color" id="colorDirect" tabindex="-1" aria-hidden="true">

      <div id="colorPop" hidden>
        <p id="colorPopTitle"></p>
        <div id="palette"></div>
        <div class="custom">
          ほかの色
          <input type="color" id="currentColor" title="色を選ぶ画面を開く">
          <input type="text" id="colorCode" maxlength="7" spellcheck="false" autocomplete="off" title="カラーコード（#1D5FC2 のように入れる）">
        </div>
      </div>
    </div>
    <button class="tool" data-tool="pick" title="スポイト（I）：クリックした所のカラーコードをコピーする（塗りがなければ線。Shift で線）。もう一度押すと終わる">
      <svg class="ic" viewBox="0 0 24 24"><path d="m3 21 1-1h3l9-9M4 20v-3l9-9"/><path d="m14 7 4-4a2 2 0 0 1 3 3l-4 4 .5.5a1.5 1.5 0 0 1-2 2L11 8a1.5 1.5 0 0 1 2-2z"/></svg>スポイト
    </button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button class="tool" id="btnDelete" title="削除（Delete）">
      <svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M6 6l1 14a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-14M10 11v6M14 11v6"/></svg>削除
    </button>
  </div>
  <!-- 線・四角・丸・文字の設定（段の高さは変わらないので、道具を切り替えてもキャンバスはずれない） -->
  <div id="toolOptions"></div>
  <span class="spacer"></span>
  <label class="field" title="グリッド（置く・動かすときに吸い付く間隔）">
    <span class="fieldLabel">グリッド</span>
    <select id="gridSelect">
      <option value="0">なし</option>
      <option value="5">5</option>
      <option value="10" selected>10</option>
      <option value="20">20</option>
    </select>
  </label>
</div>

<main>
  <aside id="items">
    <h2 class="heading">部品</h2>
    <div id="itemList"></div>
    <button id="addPart" title="assets/parts のような部品の SVG を読み込む">

];

    ■ 中の部品の名前（id の最後の言葉で役割が決まる）

      ～_value-bar       値に合わせて幅が変わる（描いた幅 = 100）

const PARTS_KEY = "svgmap-editor-parts";

const content = $("#content");
const overlay = $("#overlay");
const overlayTmp = $("#overlayTmp");
const overlayHover = $("#overlayHover");

let strokeColor = "#1D5FC2";

let zoom = 1;

let keepDrawing = false; // 連続で描く

let doubleWidth = 12;
let drag = null;
let linePts = [];
let ghost = null;
let hovered = null;
let undoStack = [], future = [], current = null;

// ---------------------------------------------------------------
// 小道具
// ---------------------------------------------------------------
const r2 = n => Math.round(n * 100) / 100;
const snap = v => grid ? Math.round(v / grid) * grid : r2(v);
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const escXml = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

function h(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "value") e.value = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(k => k != null && e.append(k));
  return e;
}

function svgEl(tag, attrs = {}) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}

let toastTimer;
// chip に色を渡すと、文の後ろにその色の見本を出す
function toast(msg, { chip, ms = 2600 } = {}) {
  const t = $("#toast");
  t.textContent = msg;
  if (chip) t.append(h("span", { class: "chip", style: `background:${chip}` }));
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), ms);
}

function toHex(c) {
  if (!c) return "#000000";
  const m = /^rgba?\((\d+),\s*(\d+),\s*(\d+)(?:,\s*([\d.]+))?\)$/.exec(c);
  if (m) return "#" + [m[1], m[2], m[3]].map(n => (+n).toString(16).padStart(2, "0")).join("").toUpperCase();
  if (/^#[0-9a-f]{3}$/i.test(c)) return ("#" + c.slice(1).split("").map(x => x + x).join("")).toUpperCase();
  if (/^#[0-9a-f]{6}$/i.test(c)) return c.toUpperCase();
  return null;
}

function toCanvas(e) {
  return new DOMPoint(e.clientX, e.clientY).matrixTransform(content.getScreenCTM().inverse());
}

// クリックされた図形 → キャンバスに直接置いてある要素（＝1つの部品）
function topObject(t) {
  while (t && t.parentNode !== content) {
    t = t.parentNode;
    if (!t || t === canvas || t === document) return null;
  }
  return t || null;
}

const isLocked = el => el.getAttribute("data-locked") === "1";
const getComments = el => { try { return JSON.parse(el.getAttribute("data-comments") || "[]"); } catch { return []; } };
const setComments = (el, list) => list.length ? el.setAttribute("data-comments", JSON.stringify(list)) : el.removeAttribute("data-comments");
const allIds = () => Array.from(content.querySelectorAll("[id]"), e => e.id);

function duplicateIds() {
  const count = {};
  allIds().forEach(id => count[id] = (count[id] || 0) + 1);
  return Object.keys(count).filter(id => count[id] > 1);
}

// データとつながる要素ID（PC-001、TEMP-1F など。中の部品と集計表は除く）
const dataIds = () => allIds().filter(id => !id.includes("_") && !/^(select|legend|count|pct)-/.test(id));

// ---------------------------------------------------------------
// 位置（transform の translate）
// ---------------------------------------------------------------
function getTranslate(el) {
  const t = el.getAttribute("transform") || "";
  const m = /^\s*translate\(\s*(-?[\d.]+(?:e[-+]?\d+)?)(?:[\s,]+(-?[\d.]+(?:e[-+]?\d+)?))?\s*\)/.exec(t);
  return m ? { x: +m[1], y: +(m[2] || 0), rest: t.slice(m[0].length).trim() } : { x: 0, y: 0, rest: t.trim() };
}

function setTranslate(el, x, y) {
  const { rest } = getTranslate(el);
  x = r2(x); y = r2(y);
  const v = [(x || y) ? `translate(${x} ${y})` : "", rest].filter(Boolean).join(" ");
  v ? el.setAttribute("transform", v) : el.removeAttribute("transform");
}

function moveBy(el, dx, dy) {
  const t = getTranslate(el);
  setTranslate(el, t.x + dx, t.y + dy);
}

// キャンバス上での外枠
function bbox(el) {
  try {
    const b = el.getBBox();
    const m = content.getCTM().inverse().multiply(el.getCTM());
    const pts = [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]]
      .map(([x, y]) => new DOMPoint(x, y).matrixTransform(m));
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const x = Math.min(...xs), y = Math.min(...ys);
    return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
  } catch {
    return null;
  }
}

function unionBBox(els) {
  const bs = els.map(bbox).filter(Boolean);
  if (!bs.length) return { x: 0, y: 0, w: 0, h: 0 };
  const x = Math.min(...bs.map(b => b.x)), y = Math.min(...bs.map(b => b.y));
  return { x, y, w: Math.max(...bs.map(b => b.x + b.w)) - x, h: Math.max(...bs.map(b => b.y + b.h)) - y };
}

// 線の d（M / L / H / V / Z の絶対座標だけ）を読む。それ以外は null
function parsePath(d) {
  if (!d) return null;
  const toks = d.match(/[A-Za-z]|-?(?:\d+\.?\d*|\.\d+)(?:e[-+]?\d+)?/g);
  if (!toks) return null;
  const segs = [];
  let cur = null;
  for (const t of toks) {
    if (/[A-Za-z]/.test(t)) {
      if (!"MLHVZ".includes(t)) return null;
      cur = { c: t, n: [] };
      segs.push(cur);
    } else {
      if (!cur) return null;
      cur.n.push(+t);
    }
  }
  return segs;
}

function shiftPath(d, dx, dy) {
  return parsePath(d).map(s => {
    const n = s.n.map((v, i) => s.c === "H" ? v + dx : s.c === "V" ? v + dy : (i % 2 ? v + dy : v + dx));
    return [s.c, ...n.map(r2)].join(" ");
  }).join(" ");
}

// ---------------------------------------------------------------
// 線（コネクタ）
// ---------------------------------------------------------------
// 線の path。幹線のように同じ形の path を重ねたグループなら、その全部
function linePaths(el) {
  if (el.localName === "path") return [el];
  if (el.localName === "g" && !el.id && el.children.length) {
    const kids = Array.from(el.children);
    const d = kids[0].getAttribute("d");
    if (kids.every(c => c.localName === "path" && c.getAttribute("d") === d)) return kids;
  }
  return [];
}

// M と L だけの d を、区切り（M）ごとの点の並びにする。それ以外の形は null
function pathPoints(d) {
  const segs = parsePath(d);
  if (!segs) return null;
  const subs = [];
  for (const s of segs) {
    if ((s.c !== "M" && s.c !== "L") || !s.n.length || s.n.length % 2) return null;
    for (let i = 0; i < s.n.length; i += 2) {
      const p = [s.n[i], s.n[i + 1]];
      if (s.c === "M" && i === 0) subs.push([p]);
      else if (subs.length) subs[subs.length - 1].push(p);
      else return null;
    }
  }
  return subs.length ? subs : null;
}

const pointsToD = subs => subs.map(s => "M " + s.map(p => p.map(r2).join(" ")).join(" L ")).join(" ");

// キャンバス上の線分 [[x1, y1], [x2, y2]] の一覧（線でなければ空）
function lineSegments(el) {
  const paths = linePaths(el);
  if (!paths.length) return [];
  const subs = pathPoints(paths[0].getAttribute("d"));
  const t = getTranslate(el);
  if (!subs || t.rest) return [];
  return subs.flatMap(s => s.slice(1).map((q, i) => [[s[i][0] + t.x, s[i][1] + t.y], [q[0] + t.x, q[1] + t.y]]));
}

function distToSegment(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const len = dx * dx + dy * dy;
  const t = len ? Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / len)) : 0;
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}

// 細い線でも選べるように、近く（画面で 6px + 線の太さの半分）をクリックしたら線を選ぶ
function lineAt(p) {
  let best = null, bestD = Infinity;
  Array.from(content.children).forEach(el => {
    if (isLocked(el)) return;
    const segs = lineSegments(el);
    if (!segs.length) return;
    const sw = Math.max(...linePaths(el).map(pp => parseFloat(pp.getAttribute("stroke-width")) || 1));
    const tol = 6 / zoom + sw / 2;
    segs.forEach(([a, b]) => {
      const d = distToSegment([p.x, p.y], a, b);
      if (d <= tol && d < bestD) { bestD = d; best = el; }
    });
  });
  return best;
}

// クリックで選ばれるもの。部品の上なら部品、そうでなければ近くの線、なければ下にあるもの
function hitObject(p, target) {
  const obj = topObject(target);
  if (obj && !isLocked(obj) && obj.localName === "g" && obj.id) return obj;
  const line = lineAt(p);
  if (line) return line;
  return obj && !isLocked(obj) ? obj : null;
}

// 吸い付く先：部品の辺の中央、線の角（点）と、線・四角の辺（線分）
function magnetTargets(exclude) {
  const pts = [], segs = [];
  Array.from(content.children).forEach(el => {
    if (el === exclude || isLocked(el)) return;
    const ls = lineSegments(el);
    if (ls.length) {
      ls.forEach(([a, b]) => { pts.push(a, b); segs.push([a, b]); });
      return;
    }
    const b = bbox(el);
    if (!b) return;
    if (el.localName === "g" && el.id) {
      pts.push([b.x + b.w / 2, b.y], [b.x + b.w / 2, b.y + b.h], [b.x, b.y + b.h / 2], [b.x + b.w, b.y + b.h / 2]);
    } else if (el.localName === "rect") {
      const c = [[b.x, b.y], [b.x + b.w, b.y], [b.x + b.w, b.y + b.h], [b.x, b.y + b.h]];
      c.forEach((q, i) => segs.push([q, c[(i + 1) % 4]]));
    }
  });
  return { pts: pts.map(q => q.map(r2)), segs };
}

// 線分の上で、カーソルにいちばん近い所（縦横の線分ならグリッドにもそろえる）
function slideOnSegment(p, a, b) {
  const clamp = (v, lo, hi) => Math.max(Math.min(lo, hi), Math.min(Math.max(lo, hi), v));
  if (a[0] === b[0]) return [a[0], clamp(snap(p[1]), a[1], b[1])];
  if (a[1] === b[1]) return [clamp(snap(p[0]), a[0], b[0]), a[1]];
  const dx = b[0] - a[0], dy = b[1] - a[1];
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy)));
  return [r2(a[0] + t * dx), r2(a[1] + t * dy)];
}

// last から縦か横にまっすぐ進む線が、線分 a-b とぶつかる所
function axisHit(last, c, a, b) {
  const horizontal = c[1] === last[1];
  const [i, j] = horizontal ? [1, 0] : [0, 1];
  const v = last[i];
  if (a[i] === b[i] || v < Math.min(a[i], b[i]) || v > Math.max(a[i], b[i])) return null;
  const q = [];
  q[i] = v;
  q[j] = r2(a[j] + (v - a[i]) / (b[i] - a[i]) * (b[j] - a[j]));
  return q;
}

// 吸い付き。{ pts: 足す点, mark: 吸い付いた所 } か null
//   縦横モードで、吸い付いた点が前の点と縦横にそろわないときは、角を1つ足して L 字にする
function magnet(raw, c, last, ortho, exclude) {
  const tol = 10 / zoom;
  const { pts, segs } = magnetTargets(exclude);
  const r = [raw.x, raw.y];
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);

  let best = null, bestD = tol;
  pts.forEach(q => { const d = dist(q, r); if (d < bestD) { bestD = d; best = q; } });
  if (best) {
    if (!last || !ortho || best[0] === last[0] || best[1] === last[1]) return { pts: [best], mark: best };
    const corner = Math.abs(best[0] - last[0]) >= Math.abs(best[1] - last[1]) ? [best[0], last[1]] : [last[0], best[1]];
    return { pts: [corner, best], mark: best };
  }

  best = null; bestD = tol;
  segs.forEach(([a, b]) => {
    const q = last && ortho ? axisHit(last, c, a, b) : slideOnSegment(r, a, b);
    if (!q) return;
    const d = dist(q, last && ortho ? c : r);
    if (d < bestD) { bestD = d; best = q; }
  });
  return best ? { pts: [best], mark: best } : null;
}

function showMark(q) {
  overlayTmp.querySelectorAll(".mark").forEach(m => m.remove());
  if (!q) return;
  overlayTmp.append(svgEl("circle", {
    class: "mark", cx: q[0], cy: q[1], r: 6 / zoom,
    fill: "rgba(34,197,94,0.35)", stroke: "#22C55E", "stroke-width": 2 / zoom, "pointer-events": "none",
  }));
}

function renderHover() {
  overlayHover.innerHTML = "";
  const el = hovered;
  if (!el || selection.includes(el) || el.parentNode !== content) return;
  // 選択と同じ見た目を薄く出す
  if (lineSegments(el).length) { outlineSegments(overlayHover, el, 0.45); return; }
  const b = bbox(el);
  if (b) outlineBox(overlayHover, b, 0.45);
}

function setHover(el) {
  if (el === hovered) return;
  hovered = el;
  renderHover();
}

const isPlainNum = v => v == null || /^\s*-?[\d.]+(e[-+]?\d+)?\s*$/.test(v);

function canShift(el, top) {
  if (!top && el.hasAttribute("transform")) return false;
  switch (el.localName) {
    case "rect": case "image": case "circle": case "ellipse": case "line": return true;
    case "text": return el.children.length === 0 && isPlainNum(el.getAttribute("x")) && isPlainNum(el.getAttribute("y"));
    case "path": return parsePath(el.getAttribute("d")) !== null;
    case "g": return !el.id && el.children.length > 0 && Array.from(el.children).every(c => canShift(c, false));
    default: return false;
  }
}

function doShift(el, dx, dy) {
  const add = (a, v) => el.setAttribute(a, r2((parseFloat(el.getAttribute(a)) || 0) + v));
  switch (el.localName) {
    case "rect": case "image": case "text": add("x", dx); add("y", dy); break;
    case "circle": case "ellipse": add("cx", dx); add("cy", dy); break;
    case "line": add("x1", dx); add("x2", dx); add("y1", dy); add("y2", dy); break;
    case "path": el.setAttribute("d", shiftPath(el.getAttribute("d"), dx, dy)); break;
    case "g": Array.from(el.children).forEach(c => doShift(c, dx, dy)); break;
  }
}

// 四角・文字・線は、動かしたあと translate を座標に戻す（書き出す SVG を素直にするため）。
// 要素IDのある部品は translate のまま（monitor.svg の PC と同じ形）
function bake(el) {
  const t = getTranslate(el);
  if (t.rest || (!t.x && !t.y) || !canShift(el, true)) return;
  doShift(el, t.x, t.y);
  el.removeAttribute("transform");
}

// ---------------------------------------------------------------
// ID
// ---------------------------------------------------------------
// PC-001 → 「PC-」+ 3桁、SW-CORE → 「SW-」+ 2桁
function idRule(id) {
  if (/^select-/.test(id)) return { summary: true };
  const m = /^(.*?)(\d+)$/.exec(id);
  if (m) return { prefix: m[1], digits: m[2].length };
  const i = id.lastIndexOf("-");
  return { prefix: i > 0 ? id.slice(0, i + 1) : id + "-", digits: 2 };
}

function nextId(id) {
  const rule = idRule(id);
  const used = allIds();
  if (rule.summary) {
    const s = Object.keys(STATES).find(s => !used.includes("select-" + s));
    return s ? "select-" + s : id;
  }
  const re = new RegExp("^" + escRe(rule.prefix) + "(\\d+)$");
  let max = 0;
  used.forEach(x => { const m = re.exec(x); if (m) max = Math.max(max, +m[1]); });
  return rule.prefix + String(max + 1).padStart(rule.digits, "0");
}

// グループの ID を変え、中の部品の名前（旧ID_～）とラベルの文字もそろえる
function assignId(el, newId) {
  const old = el.id;
  el.id = newId;
  if (!old || old === newId) return;
  el.querySelectorAll("[id]").forEach(d => {
    if (d.id.startsWith(old + "_")) d.id = newId + d.id.slice(old.length);
  });
  el.querySelectorAll("text").forEach(t => {
    if (t.children.length === 0 && t.textContent.trim() === old) t.textContent = newId;
  });
  setComments(el, getComments(el).map(c => c.split(old).join(newId)));
}

// 集計表の行の状態を変える（select / legend / count / pct の4か所と見出し）
function setSummaryState(el, state) {
  const old = el.id.replace(/^select-/, "");
  [el, ...el.querySelectorAll("[id]")].forEach(d => {
    const m = /^(select|legend|count|pct)-(.+)$/.exec(d.id);
    if (m && m[2] === old) d.id = `${m[1]}-${state}`;
  });
  if (STATES[old]) {
    el.querySelectorAll("text").forEach(t => {
      if (t.children.length === 0 && t.textContent.trim() === STATES[old]) t.textContent = STATES[state];
    });
  }
  setComments(el, getComments(el).map(c => c.split(STATES[old] || old).join(STATES[state])));
}

// ---------------------------------------------------------------
// 履歴（元に戻す / やりなおし）と一時保存
// ---------------------------------------------------------------
function snapshot() {
  return JSON.stringify({ html: content.innerHTML, vb: doc.vb, header: doc.header, rootAttrs: doc.rootAttrs });
}

function restore(s) {
  const o = JSON.parse(s);
  content.innerHTML = o.html;
  doc.vb = o.vb;
  doc.header = o.header;
  doc.rootAttrs = o.rootAttrs || { ...DEFAULT_ROOT_ATTRS };
  applyCanvas();
  select([]);
}

function commit() {
  const s = snapshot();
  if (s === current) return;
  if (current !== null) undoStack.push(current);
  if (undoStack.length > 200) undoStack.shift();
  current = s;
  future = [];
  saveDraft();
  afterChange();
}

function resetHistory() {
  undoStack = []; future = [];
  current = snapshot();
  saveDraft();
  afterChange();
}

function undo() {
  if (!undoStack.length) return;
  future.push(current);
  current = undoStack.pop();
  restore(current);
  saveDraft();
  afterChange();
}

function redo() {
  if (!future.length) return;
  undoStack.push(current);
  current = future.pop();
  restore(current);
  saveDraft();
  afterChange();
}

function afterChange() {
  $("#btnUndo").disabled = !undoStack.length;
  $("#btnRedo").disabled = !future.length;
  renderLayers();
  renderOverlay();
}

function saveDraft() {
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({ snap: current, fileName: doc.fileName }));
  } catch { /* 保存できない環境では何もしない */ }
}

// ---------------------------------------------------------------
// キャンバス
// ---------------------------------------------------------------
function applyCanvas() {
  const [x, y, w, hh] = doc.vb;
  canvas.setAttribute("viewBox", doc.vb.join(" "));
  canvas.style.width = w * zoom + "px";
  canvas.style.height = hh * zoom + "px";
  content.setAttribute("font-family", doc.rootAttrs["font-family"] || DEFAULT_ROOT_ATTRS["font-family"]);
  const gr = $("#gridRect");
  gr.setAttribute("x", x); gr.setAttribute("y", y);
  gr.setAttribute("width", w); gr.setAttribute("height", hh);
  gr.style.display = grid ? "" : "none";
  const pat = $("#gridPattern");
  pat.setAttribute("x", x); pat.setAttribute("y", y);
  pat.setAttribute("width", grid || 10); pat.setAttribute("height", grid || 10);
  $("#gridPath").setAttribute("d", `M ${grid || 10} 0 L 0 0 0 ${grid || 10}`);
  $("#gridPath").setAttribute("stroke-width", 1 / zoom);
  if (document.activeElement !== $("#zoomLabel")) $("#zoomLabel").value = Math.round(zoom * 100) + "%";
  // 「開く」で開いたファイルなら、その場所に上書きできる。それ以外（新規・前回の続き）は保存先が決まっていない
  $("#fileName").textContent = doc.fileName + (doc.handle ? "" : "（保存先：未設定）");
  $("#fileName").title = doc.handle
    ? "「保存」でこのファイルに上書きします"
    : "保存先が決まっていません。「保存」を押すと保存先を選ぶ画面が出ます（「開く」で開いたファイルなら、そのまま上書きできます）";
  renderOverlay();
}

function setZoom(z, anchor) {
  const stage = $("#stage");
  z = Math.min(8, Math.max(0.1, z));
  if (!anchor) {
    // ボタンや入力で変えたときは、見えている所の真ん中を中心に拡大・縮小する
    const r = stage.getBoundingClientRect();
    anchor = { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 };
  }
  const p = toCanvas(anchor);
  const old = zoom;
  zoom = z;
  applyCanvas();
  if (p) {
    stage.scrollLeft += (p.x - doc.vb[0]) * (z - old);
    stage.scrollTop += (p.y - doc.vb[1]) * (z - old);
  }
}

function fitZoom() {
  const stage = $("#stage");
  setZoom(Math.min((stage.clientWidth - 80) / doc.vb[2], (stage.clientHeight - 80) / doc.vb[3]));
}

// ---------------------------------------------------------------
// 選択と枠の表示
// ---------------------------------------------------------------
function select(els) {
  selection = els.filter(Boolean);
  renderHover();
  renderOverlay();
  renderProps();
  renderLayers();
}

function resizable(el) {
  return selection.length === 1 && (el.localName === "rect" || el.localName === "ellipse") && !getTranslate(el).rest;
}

// 選択の色。地図で使っている青・水色・紫と見分けやすいオレンジにし、暗い縁取りを付けて
// 明るい所でも暗い所でも見えるようにする
// （オプションで変えられる。このブラウザに覚えておく）
const SEL_DEFAULT = "#FF9F1A";
const SEL_KEY = "svgmap-editor-selcolor";
const SEL_PRESETS = [
  ["オレンジ", "#FF9F1A"], ["青", "#3B82F6"], ["黄", "#FACC15"], ["緑", "#22C55E"],
  ["ピンク", "#EC4899"], ["赤", "#EF4444"], ["水色", "#22D3EE"], ["白", "#FFFFFF"],
];
let SEL = SEL_DEFAULT;
try { SEL = localStorage.getItem(SEL_KEY) || SEL_DEFAULT; } catch { /* 覚えていなければオレンジ */ }

function setSelColor(c) {
  SEL = c.toUpperCase();
  try { localStorage.setItem(SEL_KEY, SEL); } catch { /* 覚えられなくても色は変わる */ }
  renderSelColors();
  renderOverlay();
  renderHover();
}

function renderSelColors() {
  const box = $("#selColors");
  box.innerHTML = "";
  SEL_PRESETS.forEach(([name, c]) => box.append(h("button", {
    class: c === SEL ? "active" : "", title: c, onclick: () => setSelColor(c),
  }, h("i", { style: `background:${c}` }), name)));
  $("#selColorPick").value = SEL;
}
const HALO = "rgba(0,0,0,0.55)";

// 枠（縁取り＋実線）
function outlineBox(group, b, opacity = 1) {
  const pad = 3 / zoom;
  const box = { x: b.x - pad, y: b.y - pad, width: b.w + pad * 2, height: b.h + pad * 2, fill: "none", "pointer-events": "none" };
  group.append(
    svgEl("rect", { ...box, stroke: HALO, "stroke-width": 4 / zoom, opacity }),
    svgEl("rect", { ...box, stroke: SEL, "stroke-width": 2 / zoom, opacity }));
}

// 線の周りを薄く縁取る。線そのものは上に描き直して、元の色のまま見えるようにする
function outlineSegments(group, el, opacity = 1) {
  const segs = lineSegments(el);
  const sw = Math.max(...linePaths(el).map(pp => parseFloat(pp.getAttribute("stroke-width")) || 1));
  const d = segs.map(([a, b]) => `M ${a.join(" ")} L ${b.join(" ")}`).join(" ");
  group.append(svgEl("path", {
    d, fill: "none", stroke: SEL, "stroke-width": sw + 10 / zoom, opacity: opacity * 0.45,
    "stroke-linecap": "round", "stroke-linejoin": "round", "pointer-events": "none",
  }));
  const copy = stripIds(el.cloneNode(true));
  copy.setAttribute("pointer-events", "none");
  group.append(copy);
}

// 持ち手（四角は大きさ変更と四隅の目印、丸は線の角）
function handle(attrs, round) {
  const s = 8 / zoom;
  const base = { fill: "#FFFFFF", stroke: SEL, "stroke-width": 2 / zoom };
  return round
    ? svgEl("circle", { ...base, cx: attrs.x, cy: attrs.y, r: s * 0.7, ...attrs.extra })
    : svgEl("rect", { ...base, x: attrs.x - s / 2, y: attrs.y - s / 2, width: s, height: s, ...attrs.extra });
}

function renderOverlay() {
  overlay.innerHTML = "";
  selection = selection.filter(el => el.parentNode === content);
  selection.forEach(el => {
    const b = bbox(el);
    if (!b) return;
    const isLine = lineSegments(el).length > 0;
    if (isLine) outlineSegments(overlay, el);
    else outlineBox(overlay, b);

    // 線を1本だけ選んだら、角に持ち手を出す（ドラッグで角を動かせる）
    const paths = selection.length === 1 ? linePaths(el) : [];
    const subs = paths.length && !getTranslate(el).rest ? pathPoints(paths[0].getAttribute("d")) : null;
    if (subs) {
      const t = getTranslate(el);
      subs.forEach((s, si) => s.forEach((q, i) => overlay.append(handle({
        x: q[0] + t.x, y: q[1] + t.y,
        extra: { "data-handle": "vertex", "data-sub": si, "data-i": i, style: "cursor: move" },
      }, true))));
      return;
    }
    if (isLine) return;

    // 四隅の目印。四角と丸は、四隅と辺の真ん中の持ち手で大きさを変えられる
    const pad = 3 / zoom;
    const [l, r, tp, bt] = [b.x - pad, b.x + b.w + pad, b.y - pad, b.y + b.h + pad];
    if (!resizable(el)) {
      [[l, tp], [r, tp], [l, bt], [r, bt]].forEach(([x, y]) => overlay.append(handle({ x, y, extra: { "pointer-events": "none" } })));
      return;
    }
    const xs = { "-1": l, "0": (l + r) / 2, "1": r }, ys = { "-1": tp, "0": (tp + bt) / 2, "1": bt };
    RESIZE_DIRS.forEach(([dx, dy, cursor]) => {
      const x = xs[dx], y = ys[dy];
      const extra = { "data-handle": "resize", "data-dx": dx, "data-dy": dy, style: `cursor: ${cursor}` };
      overlay.append(handle({ x, y, extra }));
      // 見た目より広い所でもつかめるように、透明な持ち手を重ねる
      const s = 16 / zoom;
      overlay.append(svgEl("rect", { x: x - s / 2, y: y - s / 2, width: s, height: s, fill: "transparent", ...extra }));
    });
  });
}

// 大きさ変更の持ち手：動かす向き（-1 左・上 / 1 右・下 / 0 動かさない）とカーソル
const RESIZE_DIRS = [
  [-1, -1, "nwse-resize"], [0, -1, "ns-resize"], [1, -1, "nesw-resize"],
  [-1, 0, "ew-resize"], [1, 0, "ew-resize"],
  [-1, 1, "nesw-resize"], [0, 1, "ns-resize"], [1, 1, "nwse-resize"],
];

// ---------------------------------------------------------------
// 部品の一覧
// ---------------------------------------------------------------
function makePart(def, custom = false) {
  const d = new DOMParser().parseFromString(`<svg xmlns="${NS}">${def.markup}</svg>`, "image/svg+xml");
  const g = Array.from(d.documentElement.children).find(e => e.id);
  if (!g) return null;
  g.removeAttribute("transform");
  return { ...def, node: g, id: g.id, custom };
}

function stripIds(el) {
  [el, ...el.querySelectorAll("[id]")].forEach(e => e.removeAttribute("id"));
  return el;
}

function renderItems() {
  const list = $("#itemList");
  list.innerHTML = "";
  parts.forEach((p, i) => {
    const thumb = svgEl("svg", { viewBox: p.viewBox, "font-family": DEFAULT_ROOT_ATTRS["font-family"] });
    thumb.append(stripIds(document.importNode(p.node, true)));
    const item = h("div", {
      class: "item" + (armedPart === p ? " armed" : ""), draggable: "true", title: p.id,
      ondragstart: e => { e.dataTransfer.setData("text/plain", "part:" + i); e.dataTransfer.effectAllowed = "copy"; },
      onclick: () => { armedPart === p ? setTool("select") : armPart(p); },
    }, thumb, h("span", {}, p.name));
    if (p.custom) {
      item.append(h("button", {
        class: "remove", title: "一覧から外す",
        onclick: e => { e.stopPropagation(); parts.splice(i, 1); saveParts(); renderItems(); },
      }, "×"));
    }
    list.append(item);
  });
}

function saveParts() {
  try {
    const custom = parts.filter(p => p.custom).map(({ name, viewBox, markup }) => ({ name, viewBox, markup }));
    localStorage.setItem(PARTS_KEY, JSON.stringify(custom));
  } catch { /* 保存できない環境では何もしない */ }
}

function loadPartFile(text, fileName) {
  const d = new DOMParser().parseFromString(text, "image/svg+xml");
  const root = d.documentElement;
  if (root.localName !== "svg") return toast(`${fileName} は SVG として読めませんでした`);
  const g = Array.from(root.children).find(e => e.id);
  if (!g) return toast(`${fileName} に id の付いた部品が見つかりませんでした`);
  const nameComment = /素材[:：]\s*(\S+)/.exec(text);
  const def = {
    name: nameComment ? nameComment[1] : fileName.replace(/\.svg$/i, ""),
    viewBox: root.getAttribute("viewBox") || `0 0 ${root.getAttribute("width") || 100} ${root.getAttribute("height") || 100}`,
    markup: new XMLSerializer().serializeToString(g),
  };
  const p = makePart(def, true);
  if (p) {
    parts.push(p);
    saveParts();
    renderItems();
    toast(`部品「${p.name}」を追加しました`);
  }
}

function armPart(p) {
  setTool("place");
  armedPart = p;
  renderItems();
}

function placePart(p, pt) {
  // 番号は置く前に決める（置いたあとだと部品の元の ID も数えてしまう）
  const newId = nextId(p.id);
  const el = document.importNode(p.node, true);
  content.append(el);
  if (idRule(p.id).summary) {
    if (newId !== el.id) setSummaryState(el, newId.replace(/^select-/, ""));
    setComments(el, [`${STATES[el.id.replace(/^select-/, "")] || el.id}の行（クリックで${STATES[el.id.replace(/^select-/, "")] || ""}をまとめて選択）`]);
  } else {
    assignId(el, newId);
    setComments(el, [el.id]);
  }
  const b = bbox(el);
  moveBy(el, snap(pt.x - b.w / 2) - b.x, snap(pt.y - b.h / 2) - b.y);
  commit();
  select([el]);
  if (newId === p.id && idRule(p.id).summary && duplicateIds().length) toast("集計表の行は4種類とも置かれています");
}

function updateGhost(pt) {
  if (!armedPart) return;
  if (!ghost) {
    ghost = stripIds(document.importNode(armedPart.node, true));
    ghost.setAttribute("opacity", "0.55");
    ghost.setAttribute("pointer-events", "none");
    ghost.setAttribute("font-family", content.getAttribute("font-family"));
    overlayTmp.append(ghost);
    ghost._bb = ghost.getBBox();
  }
  const b = ghost._bb;
  setTranslate(ghost, snap(pt.x - b.width / 2) - b.x, snap(pt.y - b.height / 2) - b.y);
}

// ---------------------------------------------------------------
// 道具
// ---------------------------------------------------------------
const CURSORS = { line: "cur-cross", rect: "cur-cross", ellipse: "cur-cross", place: "cur-cross", text: "cur-text", zoom: "cur-zoom", pick: "cur-pick" };

function setTool(t) {
  if (tool === "line" && t !== "line") linePts = [];
  tool = t;
  armedPart = null;
  ghost = null;
  overlayTmp.innerHTML = "";
  setHover(null);
  document.querySelectorAll(".tool[data-tool]").forEach(b => b.classList.toggle("active", b.dataset.tool === t));
  canvas.setAttribute("class", CURSORS[t] || "");
  updateZoomMode();
  renderToolOptions();
  fitToolbar();
  renderItems();
}

// 線の色を白に近づけた色（二重線の内側に使う）
function lighten(c, t) {
  const hex = toHex(c) || "#888888";
  const ch = i => Math.round(parseInt(hex.slice(i, i + 2), 16) * (1 - t) + 255 * t).toString(16).padStart(2, "0");
  return ("#" + ch(1) + ch(3) + ch(5)).toUpperCase();
}

// 線の種類の見本
function lineStylePreview(style) {
  const svg = svgEl("svg", { viewBox: "0 0 32 14" });
  LINE_STYLES[style].layers().forEach(l => svg.append(svgEl("path", {
    d: "M 2 7 L 30 7", fill: "none", stroke: l.stroke, "stroke-width": Math.min(l.width, 12) * 0.8,
    "stroke-opacity": l.opacity ?? 1, "stroke-linecap": "round",
  })));
  return svg;
}

// 道具の段の「削除」と「グリッド」の間に出す設定（線・四角・丸・文字のときだけ）。
// 段に収まるように小さくし、説明はマウスを乗せたときに出す
function renderToolOptions() {
  const box = $("#toolOptions");
  box.innerHTML = "";
  if (!["line", "rect", "ellipse", "text"].includes(tool)) return;
  box.append(h("span", { class: "sep" }));
  if (tool === "line") {
    box.append(h("div", { class: "lineStyles" },
      Object.entries(LINE_STYLES).map(([k, v]) => h("button", {
        class: k === lineStyle ? "active" : "", title: `${v.label}（線の色）`, "aria-label": v.label,
        onclick: () => { lineStyle = k; renderToolOptions(); },
      }, lineStylePreview(k)))));
    const isDouble = lineStyle === "double";
    box.append(h("label", { class: "field", title: isDouble ? "外側の線の太さ（内側はその 1/3）" : "線の太さ" }, "太さ", h("input", {
      type: "number", min: "1", max: "60", value: isDouble ? doubleWidth : lineWidth,
      oninput: e => {
        const v = +e.target.value || 1;
        if (isDouble) doubleWidth = v; else lineWidth = v;
        box.querySelector(".lineStyles button.active svg").replaceWith(lineStylePreview(lineStyle));
      },
    })));
  }
  // 連続で描く（オンなら、描き終わっても選択の道具に戻らない）
  box.append(h("div", { class: "lineStyles" }, icon(h("button", {
    class: keepDrawing ? "active" : "", "aria-pressed": String(keepDrawing),
    title: "連続で描く：オンのあいだは、描き終わっても選択に戻らず続けて描ける（Esc で選択に戻る）",
    onclick: () => { keepDrawing = !keepDrawing; renderToolOptions(); },
  }, "連続"), ICONS.repeat)));
}

// 道具の段が入りきらないときは、道具の名前を隠して詰める
function fitToolbar() {
  const tb = $("#toolbar");
  tb.classList.remove("compact");
  if (tb.scrollWidth > tb.clientWidth) tb.classList.add("compact");
}

const colorOf = which => which === "fill" ? fillColor : strokeColor;

// 塗り・線の色を変える。apply なら、選んでいる図形の塗り・線も変える
// （record：元に戻すの履歴に残すか。色を選ぶ画面で動かしているあいだは残さず、決めたときに残す）
function setColor(which, c, { apply = false, record = true } = {}) {
  if (which === "fill") fillColor = c; else strokeColor = c;
  if (which === "fill") $("#fillSwatch").style.background = c;
  else $("#strokeSwatch").style.borderColor = c;
  if (which === colorTarget) showPopColor();
  if (which === "stroke" && tool === "line") renderToolOptions(); // 線の見本の色も変える
  if (apply && selection.length) applyColorToSelection(which, c, record);
}

// 色の一覧に、いま変えている方（塗り・線）の色を出す
function showPopColor() {
  const c = colorOf(colorTarget);
  $("#colorPopTitle").textContent = colorTarget === "fill" ? "塗りの色" : "線の色";
  $("#currentColor").value = toHex(c) || "#000000";
  const code = $("#colorCode");
  if (document.activeElement !== code) { code.value = toHex(c) || c; code.classList.remove("invalid"); }
  document.querySelectorAll(".swatch").forEach(s => s.classList.toggle("active", s.dataset.color === toHex(c)));
  document.querySelectorAll(".colorBtn").forEach(b => b.classList.toggle("open", !$("#colorPop").hidden && b.dataset.colorTarget === colorTarget));
}

function applyColorToSelection(which, c, record) {
  const targets = colorTargets(selection, which, true);
  if (!targets.length) {
    if (record) toast(which === "fill" ? "選んでいるものには、塗りを変えられる図形がありません" : "選んでいるものには、線を変えられる図形がありません");
    return;
  }
  targets.forEach(el => which === "fill" ? setFill(el, c) : setStroke(el, c));
  renderOverlay();
  if (record) { commit(); renderProps(); }
}

// 「塗り」「線」ボタンを押すと色の一覧が開く
function renderPalette() {
  const box = $("#palette");
  const pop = $("#colorPop");
  const change = (c, record = true) => setColor(colorTarget, c, { apply: true, record });
  // 色を選ぶ画面を動かし終わったら、履歴に残す
  const done = () => { if (selection.length) { commit(); renderProps(); } };
  PALETTE.forEach(c => box.append(h("button", {
    class: "swatch", title: c, "data-color": c, style: `background:${c}`,
    onclick: () => { change(c); pop.hidden = true; showPopColor(); },
  })));
  $("#currentColor").addEventListener("input", e => change(e.target.value.toUpperCase(), false));
  $("#currentColor").addEventListener("change", done);
  // カラーコードの入力：「#1D5FC2」「1d5fc2」など。6桁そろったらすぐその色にする
  // （「#abc」の3桁は Enter で決定。入れている途中で色が変わらないように）
  const code = $("#colorCode");
  const digits = () => code.value.trim().replace(/^#/, "");
  code.addEventListener("focus", () => code.select());
  code.addEventListener("input", () => {
    const d = digits();
    code.classList.toggle("invalid", /[^0-9a-f]/i.test(d) || d.length > 6);
    if (/^[0-9a-f]{6}$/i.test(d)) change(toHex("#" + d));
  });
  code.addEventListener("keydown", e => {
    if (e.key === "Enter") {
      const d = digits();
      if (/^([0-9a-f]{3}|[0-9a-f]{6})$/i.test(d)) change(toHex("#" + d));
      code.blur();
      pop.hidden = true;
      showPopColor();
    }
    if (e.key === "Escape") code.blur();
  });
  // 入れかけのままなら、今の色の表示に戻す
  code.addEventListener("blur", () => { const c = colorOf(colorTarget); code.value = toHex(c) || c; code.classList.remove("invalid"); });
  document.querySelectorAll(".colorBtn").forEach(btn => {
    btn.onclick = () => {
      const which = btn.dataset.colorTarget;
      const r = btn.getBoundingClientRect();
      pop.style.left = r.left + "px";
      pop.style.top = r.bottom + 6 + "px";
      pop.hidden = !pop.hidden && colorTarget === which;
      colorTarget = which;
      showPopColor();
    };
    // ダブルクリックで、色を選ぶ画面をすぐ開く
    btn.ondblclick = () => {
      pop.hidden = true;
      colorTarget = btn.dataset.colorTarget;
      showPopColor();
      const picker = $("#colorDirect");
      picker.value = toHex(colorOf(colorTarget)) || "#000000";
      try { picker.showPicker(); } catch { picker.click(); }
    };
  });
  $("#colorDirect").addEventListener("input", e => change(e.target.value.toUpperCase(), false));
  $("#colorDirect").addEventListener("change", done);
  document.addEventListener("pointerdown", e => {
    if (e.target.closest("#colorBox") || pop.hidden) return;
    pop.hidden = true;
    showPopColor();
  });
}

// 線のアイコン（24 マス）
const ICONS = {
  lock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  unlock: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.7-1.5"/>',
  moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>',
  repeat: '<path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
};

function icon(el, paths) {
  el.insertAdjacentHTML("afterbegin", `<svg class="ic" viewBox="0 0 24 24">${paths}</svg>`);
  return el;
}

// ダークモード / ライトモード の切り替え（このブラウザに覚えておく）。ボタンには切り替え先を出す
const THEME_KEY = "svgmap-editor-theme";
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const btn = $("#btnTheme");
  btn.innerHTML = "";
  icon(btn, theme === "dark" ? ICONS.sun : ICONS.moon).append(theme === "dark" ? "ライトモード" : "ダークモード");
}
$("#btnTheme").onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(THEME_KEY, next); } catch { /* 覚えられなくても切り替えはできる */ }
};
try { applyTheme(localStorage.getItem(THEME_KEY) || "dark"); } catch { applyTheme("dark"); }

// 四角
// 丸：ドラッグした四角に収まる楕円。Shift で正円
function setEllipseBox(el, x, y, w, hh, square) {
  if (square) w = hh = Math.max(w, hh);
  el.setAttribute("cx", r2(x + w / 2)); el.setAttribute("cy", r2(y + hh / 2));
  el.setAttribute("rx", r2(w / 2)); el.setAttribute("ry", r2(hh / 2));
}

function startEllipse(pt) {
  const x0 = snap(pt.x), y0 = snap(pt.y);
  const el = svgEl("ellipse", { cx: x0, cy: y0, rx: 0, ry: 0, fill: fillColor });
  content.append(el);
  drag = {
    move(p, e) {
      const x1 = snap(p.x), y1 = snap(p.y);
      const w = Math.abs(x1 - x0), hh = Math.abs(y1 - y0);
      const s = e.shiftKey ? Math.max(w, hh) : 0;
      setEllipseBox(el, x1 < x0 ? x0 - (s || w) : x0, y1 < y0 ? y0 - (s || hh) : y0, w, hh, e.shiftKey);
    },
    end() {
      if (+el.getAttribute("rx") < 1 || +el.getAttribute("ry") < 1) { el.remove(); return; }
      commit();
      doneDrawing(el);
    },
  };
}

function startRect(pt) {
  const x0 = snap(pt.x), y0 = snap(pt.y);
  const el = svgEl("rect", { x: x0, y: y0, width: 0, height: 0, rx: 4, fill: fillColor });
  content.append(el);
  drag = {
    move(p) {
      const x1 = snap(p.x), y1 = snap(p.y);
      el.setAttribute("x", Math.min(x0, x1)); el.setAttribute("y", Math.min(y0, y1));
      el.setAttribute("width", Math.abs(x1 - x0)); el.setAttribute("height", Math.abs(y1 - y0));
    },
    end() {
      if (+el.getAttribute("width") < 2 || +el.getAttribute("height") < 2) { el.remove(); return; }
      commit();
      doneDrawing(el);
    },
  };
}

// 線：次に足す点（縦横にそろえ、部品や線に吸い付く）
function nextLinePoints(p, e) {
  const ortho = !e.shiftKey;
  let x = snap(p.x), y = snap(p.y);
  const last = linePts[linePts.length - 1];
  if (last && ortho) {
    if (Math.abs(x - last[0]) >= Math.abs(y - last[1])) y = last[1]; else x = last[0];
  }
  return magnet(p, [x, y], last, ortho, null) || { pts: [[x, y]], mark: null };
}

function previewLine(p, e) {
  overlayTmp.innerHTML = "";
  const next = p ? nextLinePoints(p, e) : { pts: [], mark: null };
  const pts = [...linePts, ...next.pts];
  if (pts.length > 1) {
    overlayTmp.append(svgEl("path", {
      d: "M " + pts.map(q => q.join(" ")).join(" L "), fill: "none",
      stroke: "#3B82F6", "stroke-width": 2 / zoom, "stroke-dasharray": `${6 / zoom} ${4 / zoom}`, "pointer-events": "none",
    }));
  }
  showMark(next.mark);
}

function finishLine() {
  const pts = linePts.filter((q, i) => i === 0 || q[0] !== linePts[i - 1][0] || q[1] !== linePts[i - 1][1]);
  linePts = [];
  overlayTmp.innerHTML = "";
  if (pts.length < 2) return;
  const d = "M " + pts.map(q => q.join(" ")).join(" L ");
  // 1本ならそのまま path、二重線は path を重ねたグループ
  const paths = LINE_STYLES[lineStyle].layers().map(l => {
    const pp = svgEl("path", { d, fill: "none", stroke: l.stroke, "stroke-width": l.width, "stroke-linejoin": "round" });
    if (l.opacity != null) pp.setAttribute("stroke-opacity", l.opacity);
    return pp;
  });
  let el = paths[0];
  if (paths.length > 1) {
    el = svgEl("g", {});
    el.append(...paths);
  }
  content.append(el);
  commit();
  doneDrawing(el);
}

// 描き終わったら選択の道具に戻す。「連続で描く」がオンなら、同じ道具のまま
function doneDrawing(el) {
  if (!keepDrawing) setTool("select");
  select([el]);
}

// 文字
function createText(pt) {
  const el = svgEl("text", { x: snap(pt.x), y: snap(pt.y), "font-size": 14, fill: fillColor });
  el.textContent = "テキスト";
  content.append(el);
  commit();
  doneDrawing(el);
  // pointerdown の中でフォーカスすると、そのあとのクリックでキャンバスにフォーカスが移って選択が外れるので、押し終わってから
  window.addEventListener("pointerup", () => setTimeout(focusTextField), { once: true });
}

function focusTextField() {
  const f = $("#propText");
  if (f) { f.focus(); f.select(); }
}

// クリックした所のカラーコードをコピーする。塗りがあれば塗り、なければ線。Shift なら線
function pick(target, e) {
  if (!topObject(target)) return;
  const cs = getComputedStyle(target);
  const fill = cs.fill !== "none" ? toHex(cs.fill) : null;
  const stroke = cs.stroke !== "none" ? toHex(cs.stroke) : null;
  const c = e.shiftKey ? stroke || fill : fill || stroke;
  if (!c) return;
  copyText(c).then(
    () => toast(`カラーコードをコピーしました！ ${c}`, { chip: c, ms: 1600 }),
    () => toast(`コピーできませんでした（${c}）`, { chip: c }));
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(() => copyTextOld(text));
  }
  return copyTextOld(text);
}

// クリップボードの API が使えないとき（古いブラウザやファイルから開いたとき）
function copyTextOld(text) {
  const ta = h("textarea", { style: "position:fixed;opacity:0" });
  ta.value = text;
  document.body.append(ta);
  ta.select();
  const ok = document.execCommand("copy");
  ta.remove();
  return ok ? Promise.resolve() : Promise.reject();
}

// ---------------------------------------------------------------
// 選択・移動・大きさ変更・範囲選択
// ---------------------------------------------------------------
function startMove(pt) {
  const b0 = unionBBox(selection);
  let applied = { x: 0, y: 0 }, moved = false;
  drag = {
    move(p, e) {
      const dx = p.x - pt.x, dy = p.y - pt.y;
      if (!moved && Math.hypot(dx, dy) * zoom < 3) return;
      moved = true;
      let nx = snap(b0.x + dx) - b0.x, ny = snap(b0.y + dy) - b0.y;
      if (e.shiftKey) { if (Math.abs(dx) > Math.abs(dy)) ny = 0; else nx = 0; }
      selection.forEach(el => moveBy(el, nx - applied.x, ny - applied.y));
      applied = { x: nx, y: ny };
      renderOverlay();
    },
    end() {
      if (!moved) return;
      selection.forEach(bake);
      commit();
      renderProps();
    },
  };
}

// 持ち手の向き（dx, dy）の辺だけを動かし、反対側は動かさない。Shift で縦横同じ長さ
function startResize(handle) {
  const el = selection[0];
  const b0 = bbox(el);
  const dx = +handle.getAttribute("data-dx"), dy = +handle.getAttribute("data-dy");
  const t = getTranslate(el);
  drag = {
    move(p, e) {
      let x0 = b0.x, x1 = b0.x + b0.w, y0 = b0.y, y1 = b0.y + b0.h;
      if (dx < 0) x0 = Math.min(snap(p.x), x1 - 1);
      if (dx > 0) x1 = Math.max(snap(p.x), x0 + 1);
      if (dy < 0) y0 = Math.min(snap(p.y), y1 - 1);
      if (dy > 0) y1 = Math.max(snap(p.y), y0 + 1);
      let w = x1 - x0, hh = y1 - y0;
      if (e.shiftKey && dx && dy) {
        w = hh = Math.max(w, hh);
        if (dx < 0) x0 = x1 - w;
        if (dy < 0) y0 = y1 - hh;
      }
      // 図形の中の座標に直す（translate の分を引く）
      const x = x0 - t.x, y = y0 - t.y;
      if (el.localName === "ellipse") {
        setEllipseBox(el, x, y, w, hh, false);
      } else {
        el.setAttribute("x", r2(x)); el.setAttribute("y", r2(y));
        el.setAttribute("width", r2(w)); el.setAttribute("height", r2(hh));
      }
      renderOverlay();
    },
    end() { commit(); renderProps(); },
  };
}

// 線の角を動かす。隣の角とは縦横の関係を保つ（Shift で自由に）
function startVertexDrag(handle) {
  const el = selection[0];
  const paths = linePaths(el);
  const t = getTranslate(el);
  const orig = pathPoints(paths[0].getAttribute("d"));
  const si = +handle.getAttribute("data-sub"), i = +handle.getAttribute("data-i");
  const old = orig[si][i];
  let moved = false;
  drag = {
    move(p, e) {
      moved = true;
      const m = magnet(p, null, null, false, el);
      const target = m ? [m.mark[0] - t.x, m.mark[1] - t.y] : [snap(p.x) - t.x, snap(p.y) - t.y];
      const subs = orig.map(s => s.map(q => [...q]));
      const s = subs[si];
      s[i] = target;
      if (!e.shiftKey) {
        [i - 1, i + 1].forEach(j => {
          if (j < 0 || j >= s.length) return;
          const o = orig[si][j];
          if (o[1] === old[1]) s[j] = [s[j][0], target[1]];
          else if (o[0] === old[0]) s[j] = [target[0], s[j][1]];
        });
      }
      const d = pointsToD(subs);
      paths.forEach(pp => pp.setAttribute("d", d));
      renderOverlay();
      showMark(m && m.mark);
    },
    end() {
      showMark(null);
      if (!moved) return;
      commit();
      renderProps();
    },
  };
}

function startMarquee(pt, additive) {
  const base = additive ? [...selection] : [];
  const box = svgEl("rect", { fill: "rgba(59,130,246,0.1)", stroke: "#3B82F6", "stroke-width": 1 / zoom, "pointer-events": "none" });
  overlayTmp.append(box);
  let r = null;
  drag = {
    move(p) {
      r = { x: Math.min(pt.x, p.x), y: Math.min(pt.y, p.y), w: Math.abs(p.x - pt.x), h: Math.abs(p.y - pt.y) };
      box.setAttribute("x", r.x); box.setAttribute("y", r.y);
      box.setAttribute("width", r.w); box.setAttribute("height", r.h);
    },
    end() {
      box.remove();
      if (!r || r.w * zoom < 3) return;
      const hits = Array.from(content.children).filter(el => {
        if (isLocked(el)) return false;
        const b = bbox(el);
        return b && b.x < r.x + r.w && b.x + b.w > r.x && b.y < r.y + r.h && b.y + b.h > r.y;
      });
      select([...new Set([...base, ...hits])]);
    },
  };
}

canvas.addEventListener("pointerdown", e => {
  if (e.button === 2) {
    if (tool === "line") finishLine();
    return;
  }
  if (e.button !== 0) return;
  const pt = toCanvas(e);
  const target = e.target;
  switch (tool) {
    case "place":
      placePart(armedPart, pt);
      if (!e.shiftKey) setTool("select");
      return;
    case "zoom": setZoom(zoom * (e.altKey ? 1 / 1.25 : 1.25), e); return;
    case "rect": startRect(pt); return;
    case "ellipse": startEllipse(pt); return;
    case "line": {
      // 2点目からは、部品や線に吸い付いた所（緑の丸）をクリックしたらそこで線を終える。Alt で続ける
      const next = nextLinePoints(pt, e);
      linePts.push(...next.pts);
      if (next.mark && linePts.length > 1 && !e.altKey) finishLine();
      else previewLine(pt, e);
      return;
    }
    case "text": createText(pt); return;
    case "pick": pick(target, e); return;
  }
  if (target.getAttribute("data-handle") === "resize") { startResize(target); return; }
  if (target.getAttribute("data-handle") === "vertex") { startVertexDrag(target); return; }
  const obj = hitObject(pt, target);
  if (obj) {
    if (e.shiftKey) {
      if (selection.includes(obj)) { select(selection.filter(s => s !== obj)); return; }
      select([...selection, obj]);
    } else if (!selection.includes(obj)) {
      select([obj]);
    }
    startMove(pt);
  } else {
    if (!e.shiftKey) select([]);
    startMarquee(pt, e.shiftKey);
  }
});

canvas.addEventListener("contextmenu", e => { if (tool === "line") e.preventDefault(); });

canvas.addEventListener("dblclick", e => {
  if (tool === "line") { finishLine(); return; }
  if (tool === "select" && selection.length === 1 && selection[0].localName === "text") focusTextField();
});

window.addEventListener("pointermove", e => {
  if (drag) { drag.move(toCanvas(e), e); return; }
  if (e.target.closest && e.target.closest("#canvas")) {
    const p = toCanvas(e);
    $("#coords").textContent = `x ${Math.round(p.x)}　y ${Math.round(p.y)}`;
    if (tool === "place") updateGhost(p);
    if (tool === "line") previewLine(p, e);
    if (tool === "select") setHover(e.target.hasAttribute("data-handle") ? null : hitObject(p, e.target));
  } else {
    setHover(null);
  }
});

window.addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag;
  drag = null;
  d.end();
});

// 部品のドラッグ＆ドロップ
const stage = $("#stage");
stage.addEventListener("dragover", e => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; });
stage.addEventListener("drop", e => {
  e.preventDefault();
  const m = /^part:(\d+)$/.exec(e.dataTransfer.getData("text/plain"));
  if (m && parts[+m[1]]) placePart(parts[+m[1]], toCanvas(e));
});
stage.addEventListener("pointerdown", e => {
  if (e.target === stage || e.target.id === "stageInner") select([]);
});
stage.addEventListener("wheel", e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  setZoom(zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1), e);
}, { passive: false });

// ---------------------------------------------------------------
// 編集の操作
// ---------------------------------------------------------------
function deleteSelection() {
  if (!selection.length) return;
  selection.forEach(el => el.remove());
  select([]);
  commit();
}

function duplicateSelection() {
  if (!selection.length) return;
  const off = grid || 10;
  const clones = selection.map(el => {
    const c = el.cloneNode(true);
    el.after(c);
    placeCopy(c, off);
    return c;
  });
  commit();
  select(clones);
}

// 置いたばかりのコピーを、ずらして ID を付け直す（ID が重ならないように次の番号にする）
function placeCopy(c, off) {
  c.removeAttribute("data-locked");
  if (c.id && /^select-/.test(c.id)) {
    const n = nextId(c.id);
    if (n !== c.id) setSummaryState(c, n.replace(/^select-/, ""));
  } else if (c.id && c.localName === "g") {
    assignId(c, nextId(c.id));
  }
  moveBy(c, off, off);
  bake(c);
}

// コピー・切り取り・貼り付け（このページの中だけ）。
// 貼り付けるたびに少しずつずらすので、続けて貼っても重ならない
let clipboard = [];
let pasteCount = 0;

function copySelection(verb = "コピー") {
  if (!selection.length) return;
  clipboard = Array.from(content.children).filter(el => selection.includes(el)).map(el => el.cloneNode(true));
  pasteCount = 0;
  toast(`${clipboard.length} 個を${verb}しました（Ctrl+V で貼り付け）`, { ms: 1600 });
}

function cutSelection() {
  if (!selection.length) return;
  copySelection("切り取り");
  pasteCount = -1; // 切り取ったものは、1回目は同じ場所に貼る
  deleteSelection();
}

function pasteClipboard() {
  if (!clipboard.length) return;
  pasteCount++;
  const off = (grid || 10) * pasteCount;
  const clones = clipboard.map(el => {
    const c = el.cloneNode(true);
    content.append(c);
    placeCopy(c, off);
    return c;
  });
  commit();
  select(clones);
}

function reorder(where) {
  if (!selection.length) return;
  const ordered = Array.from(content.children).filter(el => selection.includes(el));
  if (where === "front") ordered.forEach(el => content.append(el));
  if (where === "back") {
    // ロックした背景より後ろには回さない
    const first = Array.from(content.children).find(el => !isLocked(el) && !selection.includes(el));
    ordered.forEach(el => first ? content.insertBefore(el, first) : content.append(el));
  }
  if (where === "forward") ordered.reverse().forEach(el => { const n = el.nextElementSibling; if (n && !selection.includes(n)) n.after(el); });
  if (where === "backward") ordered.forEach(el => { const p = el.previousElementSibling; if (p && !selection.includes(p)) p.before(el); });
  commit();
  renderLayers();
}

function toggleLock(el) {
  if (isLocked(el)) el.removeAttribute("data-locked");
  else {
    el.setAttribute("data-locked", "1");
    selection = selection.filter(s => s !== el);
  }
  commit();
  renderProps();
}

// 整列：選んだもの全体の外枠に合わせて、左・中央・右（上・中央・下）をそろえる
function alignSelection(mode) {
  const items = selection.map(el => ({ el, b: bbox(el) })).filter(i => i.b);
  if (items.length < 2) return;
  const u = unionBBox(selection);
  items.forEach(({ el, b }) => {
    const dx = { left: u.x - b.x, hcenter: u.x + u.w / 2 - (b.x + b.w / 2), right: u.x + u.w - (b.x + b.w) }[mode] || 0;
    const dy = { top: u.y - b.y, vcenter: u.y + u.h / 2 - (b.y + b.h / 2), bottom: u.y + u.h - (b.y + b.h) }[mode] || 0;
    if (Math.abs(dx) > 1e-6 || Math.abs(dy) > 1e-6) { moveBy(el, r2(dx), r2(dy)); bake(el); }
  });
  commit();
  renderProps();
}

// 等間隔：両端の2つはそのままで、間のすき間を同じにする
function distributeSelection(axis) {
  const items = selection.map(el => ({ el, b: bbox(el) })).filter(i => i.b);
  if (items.length < 3) return;
  const [pos, size] = axis === "x" ? ["x", "w"] : ["y", "h"];
  items.sort((a, b) => a.b[pos] - b.b[pos]);
  const first = items[0].b, last = items[items.length - 1].b;
  const total = items.reduce((sum, i) => sum + i.b[size], 0);
  const gap = (last[pos] + last[size] - first[pos] - total) / (items.length - 1);
  let at = first[pos];
  items.forEach(({ el, b }) => {
    const d = r2(at - b[pos]);
    if (d) { axis === "x" ? moveBy(el, d, 0) : moveBy(el, 0, d); bake(el); }
    at += b[size] + gap;
  });
  commit();
  renderProps();
}

const ALIGN_ICONS = {
  left: '<path d="M4 3v18"/><rect x="8" y="6" width="12" height="4" rx="1"/><rect x="8" y="14" width="7" height="4" rx="1"/>',
  hcenter: '<path d="M12 3v18"/><rect x="5" y="6" width="14" height="4" rx="1"/><rect x="7.5" y="14" width="9" height="4" rx="1"/>',
  right: '<path d="M20 3v18"/><rect x="4" y="6" width="12" height="4" rx="1"/><rect x="9" y="14" width="7" height="4" rx="1"/>',
  top: '<path d="M3 4h18"/><rect x="6" y="8" width="4" height="12" rx="1"/><rect x="14" y="8" width="4" height="7" rx="1"/>',
  vcenter: '<path d="M3 12h18"/><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="7.5" width="4" height="9" rx="1"/>',
  bottom: '<path d="M3 20h18"/><rect x="6" y="4" width="4" height="12" rx="1"/><rect x="14" y="9" width="4" height="7" rx="1"/>',
  x: '<path d="M4 3v18M20 3v18"/><rect x="9" y="7" width="6" height="10" rx="1"/>',
  y: '<path d="M3 4h18M3 20h18"/><rect x="7" y="9" width="10" height="6" rx="1"/>',
};

function alignPanel() {
  const btn = (key, label, title, onclick, disabled) => {
    const b = icon(h("button", { title, onclick, disabled }), ALIGN_ICONS[key]);
    b.append(label);
    return b;
  };
  const few = selection.length < 3;
  return [
    h("h4", {}, "横の位置をそろえる"),
    h("div", { class: "alignRow" },
      btn("left", "左", "左端をそろえる", () => alignSelection("left")),
      btn("hcenter", "中央", "左右の中央をそろえる（縦に1列に並ぶ）", () => alignSelection("hcenter")),
      btn("right", "右", "右端をそろえる", () => alignSelection("right"))),
    h("h4", {}, "縦の位置をそろえる"),
    h("div", { class: "alignRow" },
      btn("top", "上", "上端をそろえる", () => alignSelection("top")),
      btn("vcenter", "中央", "上下の中央をそろえる（横に1列に並ぶ）", () => alignSelection("vcenter")),
      btn("bottom", "下", "下端をそろえる", () => alignSelection("bottom"))),
    h("h4", {}, "等間隔に並べる" + (few ? "（3つ以上選んだとき）" : "")),
    h("div", { class: "alignRow two" },
      btn("x", "横に等間隔", "左右の両端はそのままで、すき間を同じにする", () => distributeSelection("x"), few),
      btn("y", "縦に等間隔", "上下の両端はそのままで、すき間を同じにする", () => distributeSelection("y"), few)),
  ];
}

function nudge(dx, dy) {
  if (!selection.length) return;
  selection.forEach(el => { moveBy(el, dx, dy); bake(el); });
  commit();
  renderProps();
}

// ---------------------------------------------------------------
// 右の欄：プロパティ
// ---------------------------------------------------------------
const row = (label, input) => h("label", { class: "row" }, h("span", {}, label), input);

// 入力しながら反映し、確定したら履歴に積む
function input(value, apply, opts = {}) {
  const i = h("input", { type: opts.type || "text", value: value ?? "", step: opts.step, min: opts.min, id: opts.id });
  if (!opts.onChange) i.addEventListener("input", () => { apply(i.value); renderOverlay(); });
  i.addEventListener("change", () => { if (opts.onChange) apply(i.value); commit(); renderOverlay(); });
  return i;
}

function attrInput(el, attr, opts = {}) {
  return input(el.getAttribute(attr) ?? opts.fallback ?? "", v => v === "" ? el.removeAttribute(attr) : el.setAttribute(attr, v), { type: "number", step: "any", ...opts });
}

function colorInput(el, attr) {
  const v = el.getAttribute(attr) || "";
  const text = h("input", { type: "text", value: v, placeholder: "なし" });
  const picker = h("input", { type: "color", value: toHex(v) || "#000000" });
  const apply = c => {
    if (c) el.setAttribute(attr, c); else el.removeAttribute(attr);
    renderOverlay();
  };
  text.addEventListener("input", () => { apply(text.value.trim()); const hx = toHex(text.value.trim()); if (hx) picker.value = hx; });
  text.addEventListener("change", commit);
  picker.addEventListener("input", () => { text.value = picker.value.toUpperCase(); apply(text.value); });
  picker.addEventListener("change", commit);
  return h("div", { class: "colorField" }, picker, text);
}

// 色を変えられる図形。
//   塗り：四角・丸・文字。線：線（二重線も）と、四角・丸の枠線。
//   要素ID のある部品（PC など）は、データで色が決まる所があるので対象にしない。
//   strokedOnly なら、枠線のない四角・丸は線の対象にしない（道具の段の「線」で枠線が増えないように）
function colorTargets(els, which, strokedOnly = false) {
  const shapes = els.filter(el => !(el.localName === "g" && el.id));
  if (which === "fill") return shapes.filter(el => ["rect", "ellipse", "circle", "text"].includes(el.localName));
  return shapes.filter(el => linePaths(el).length
    || (["rect", "ellipse", "circle"].includes(el.localName) && (!strokedOnly || !["", "none"].includes(strokeOf(el)))));
}

const strokeOf = el => (linePaths(el)[0] || el).getAttribute("stroke") || "";

function setFill(el, c) {
  el.setAttribute("fill", c);
  el.style.removeProperty("fill");
}

// 二重線は、内側の細い線を明るくした色にする
function setStroke(el, c) {
  const paths = linePaths(el);
  if (paths.length > 1) {
    paths[0].setAttribute("stroke", c);
    paths.slice(1).forEach(pp => pp.setAttribute("stroke", lighten(c, 0.55)));
  } else {
    (paths[0] || el).setAttribute("stroke", c);
  }
}

// 複数選んだときに、色をまとめて変える
function bulkColorPanel() {
  const shapes = selection.filter(el => !(el.localName === "g" && el.id));
  const fillTargets = colorTargets(selection, "fill");
  const strokeTargets = colorTargets(selection, "stroke");

  const field = (label, targets, getValue, setValue) => {
    if (!targets.length) return null;
    const values = targets.map(getValue);
    const same = values.every(v => v === values[0]) ? values[0] : "";
    const text = h("input", { type: "text", value: same, placeholder: "いろいろ" });
    const picker = h("input", { type: "color", value: toHex(same) || "#000000" });
    const apply = c => { if (toHex(c)) { targets.forEach(el => setValue(el, toHex(c))); renderOverlay(); } };
    text.addEventListener("input", () => { apply(text.value.trim()); const hx = toHex(text.value.trim()); if (hx) picker.value = hx; });
    text.addEventListener("change", commit);
    picker.addEventListener("input", () => { text.value = picker.value.toUpperCase(); apply(text.value); });
    picker.addEventListener("change", commit);
    return row(`${label}（${targets.length}）`, h("div", { class: "colorField" }, picker, text));
  };

  const rows = [
    field("塗り", fillTargets, el => el.getAttribute("fill") || "", setFill),
    field("線", strokeTargets, strokeOf, setStroke),
  ].filter(Boolean);
  const skipped = selection.length - shapes.length;
  const note = skipped ? h("p", { class: "hint" }, `部品（PC など）${skipped} 個は、データで色が決まるので変えません。`) : null;
  if (!rows.length) return note ? [h("h4", {}, "色をまとめて変える"), note] : [];
  return [h("h4", {}, "色をまとめて変える"), ...rows, note].filter(Boolean);
}

function positionFields(el) {
  const b = bbox(el) || { x: 0, y: 0 };
  const setPos = (axis, v) => {
    const cur = bbox(el);
    if (!cur || v === "" || isNaN(+v)) return;
    axis === "x" ? moveBy(el, +v - cur.x, 0) : moveBy(el, 0, +v - cur.y);
    bake(el);
  };
  return h("div", { class: "pair" },
    row("X", input(r2(b.x), v => setPos("x", v), { type: "number", step: "any", onChange: true })),
    row("Y", input(r2(b.y), v => setPos("y", v), { type: "number", step: "any", onChange: true })));
}

// 部品の中の、ただの文字（PC名、見出しなど）。データで変わる部品の中の文字は除く
function labelTexts(el) {
  return Array.from(el.querySelectorAll("text")).filter(t => {
    if (t.children.length || t.textContent.trim() === "--") return false;
    for (let e = t; e && e !== el; e = e.parentElement) if (e.id) return false;
    return true;
  });
}

function actionButtons(single) {
  const box = h("div", { class: "actions" },
    h("button", { onclick: duplicateSelection, title: "Ctrl+D" }, "複製"),
    h("button", { onclick: () => copySelection(), title: "Ctrl+C（Ctrl+V で貼り付け）" }, "コピー"),
    h("button", { onclick: () => reorder("front") }, "最前面"),
    h("button", { onclick: () => reorder("forward"), title: "]" }, "前面へ"),
    h("button", { onclick: () => reorder("backward"), title: "[" }, "背面へ"),
    h("button", { onclick: () => reorder("back") }, "最背面"));
  if (single) box.append(h("button", { onclick: () => toggleLock(single) }, isLocked(single) ? "ロック解除" : "ロック"));
  box.append(h("button", { class: "danger", onclick: deleteSelection, title: "Delete" }, "削除"));
  return box;
}

function kindName(el) {
  if (el.localName === "g" && el.id && /^select-/.test(el.id)) return "集計表の行";
  if (el.localName === "g" && el.id) return "部品";
  if (el.localName === "g" && Array.from(el.children).every(c => c.localName === "path")) return "線";
  return { rect: "四角", text: "文字", path: "線", line: "線", circle: "丸", ellipse: "丸", g: "グループ" }[el.localName] || el.localName;
}

function renderProps() {
  const p = $("#props");
  p.innerHTML = "";
  if (!selection.length) { renderCanvasProps(p); return; }
  if (selection.length > 1) {
    p.append(h("h3", {}, `${selection.length} 個を選択中`), ...bulkColorPanel(),
      h("p", { class: "hint" }, "ドラッグや矢印キーでまとめて動かせます。"), ...alignPanel(), actionButtons(null));
    return;
  }
  const el = selection[0];
  p.append(h("h3", {}, kindName(el) + (el.id ? `：${el.id}` : "")));

  // 集計表の行は状態を選ぶ
  if (el.id && /^select-/.test(el.id)) {
    const state = el.id.replace(/^select-/, "");
    p.append(row("状態", h("select", {
      onchange: e => { setSummaryState(el, e.target.value); commit(); renderProps(); },
    }, Object.entries(STATES).map(([k, v]) => h("option", { value: k, selected: k === state }, `${v}（${k}）`)))));
  } else if (el.id) {
    p.append(row("要素ID", input(el.id, v => {
      v = v.trim();
      if (!v) return;
      if (/[\s_]/.test(v)) { toast("要素ID に空白や _ は使えません"); return; }
      assignId(el, v);
      renderProps();
    }, { onChange: true })));
  }
  if (el.id && duplicateIds().some(d => d === el.id || d.startsWith(el.id + "_"))) {
