    p.append(h("div", { class: "warn" }, "この ID はほかでも使われています。データの要素ID は重ならないようにしてください。"));
  }

  // 部品の中のただの文字
  if (el.localName === "g") {
    const texts = labelTexts(el);
    if (texts.length) {
      p.append(h("h4", {}, "文字"));
      texts.forEach(t => p.append(row("文字", input(t.textContent, v => t.textContent = v))));
    }
    // 値の単位と小数桁数
    [el, ...el.querySelectorAll("[id]")].filter(d => /_value-text/.test(d.id)).forEach(d => {
      const unit = (/_unit=([^_]*)/.exec(d.id) || [])[1] || "";
      const dec = (/_decimals=(\d+)/.exec(d.id) || [])[1] || "";
      const name = d.id.replace(/_value-text.*$/, "").slice(el.id.length + 1) || "値";
      const rebuild = (u, n) => {
        let id = d.id.replace(/_unit=[^_]*/, "").replace(/_decimals=\d+/, "");
        if (u) id += `_unit=${u.replace(/[_\s]/g, "")}`;
        if (n !== "") id += `_decimals=${n}`;
        d.id = id;
      };
      p.append(h("h4", {}, `数値の表示（${name}）`), h("div", { class: "pair" },
        row("単位", input(unit, v => rebuild(v, (/_decimals=(\d+)/.exec(d.id) || [])[1] || ""), { onChange: true })),
        row("小数桁", input(dec, v => rebuild((/_unit=([^_]*)/.exec(d.id) || [])[1] || "", v), { type: "number", min: "0", onChange: true }))));
    });
  }

  p.append(h("h4", {}, "位置"), positionFields(el));

  if (el.localName === "rect") {
    p.append(h("h4", {}, "大きさ"), h("div", { class: "pair" },
      row("幅", attrInput(el, "width")), row("高さ", attrInput(el, "height"))),
    row("角の丸み", attrInput(el, "rx", { fallback: "0" })),
    h("h4", {}, "色"), row("塗り", colorInput(el, "fill")), row("線", colorInput(el, "stroke")),
    row("線の太さ", attrInput(el, "stroke-width", { fallback: "1" })));
  }
  if (el.localName === "text" && el.children.length === 0) {
    p.append(h("h4", {}, "文字"),
      row("文字", input(el.textContent, v => el.textContent = v, { id: "propText" })),
      row("大きさ", attrInput(el, "font-size", { fallback: "14" })),
      row("太字", h("input", {
        type: "checkbox", style: "justify-self:start", checked: el.getAttribute("font-weight") === "bold",
        onchange: e => { e.target.checked ? el.setAttribute("font-weight", "bold") : el.removeAttribute("font-weight"); commit(); },
      })),
      row("揃え", h("select", {
        onchange: e => { e.target.value === "start" ? el.removeAttribute("text-anchor") : el.setAttribute("text-anchor", e.target.value); commit(); renderOverlay(); },
      }, [["start", "左（x が左端）"], ["middle", "中央"], ["end", "右（x が右端）"]].map(([v, l]) =>
        h("option", { value: v, selected: (el.getAttribute("text-anchor") || "start") === v }, l)))),
      row("色", colorInput(el, "fill")));
  }
  if (el.localName === "path" || el.localName === "line") {
    p.append(h("h4", {}, "線"), row("色", colorInput(el, "stroke")), row("太さ", attrInput(el, "stroke-width", { fallback: "1" })));
  }
  // 二重線：外側（太い方）と内側を別々に
  const multi = el.localName === "g" && !el.id ? linePaths(el) : [];
  if (multi.length > 1) {
    multi.forEach((pp, i) => p.append(
      h("h4", {}, multi.length === 2 ? ["外側の線", "内側の線"][i] : `線 ${i + 1}`),
      row("色", colorInput(pp, "stroke")),
      row("太さ", attrInput(pp, "stroke-width", { fallback: "1" }))));
  }
  if (el.localName === "ellipse") {
    // 幅・高さで入れて、中心はそのまま
    const size = (attr, v) => { if (v !== "" && +v > 0) el.setAttribute(attr, r2(+v / 2)); };
    p.append(h("h4", {}, "大きさ"), h("div", { class: "pair" },
      row("幅", input(r2(+el.getAttribute("rx") * 2), v => size("rx", v), { type: "number", step: "any", min: "1" })),
      row("高さ", input(r2(+el.getAttribute("ry") * 2), v => size("ry", v), { type: "number", step: "any", min: "1" }))));
  }
  if (el.localName === "circle" || el.localName === "ellipse") {
    p.append(h("h4", {}, "色"), row("塗り", colorInput(el, "fill")), row("線", colorInput(el, "stroke")),
      row("線の太さ", attrInput(el, "stroke-width", { fallback: "1" })));
  }
  p.append(actionButtons(el));
}

// 背景：いちばん奥にある、キャンバス全体を覆う四角
function findBackground() {
  const el = content.firstElementChild;
  if (!el || el.localName !== "rect" || el.hasAttribute("transform")) return null;
  const n = a => parseFloat(el.getAttribute(a)) || 0;
  const [x, y, w, hh] = doc.vb;
  return n("x") <= x && n("y") <= y && n("x") + n("width") >= x + w && n("y") + n("height") >= y + hh ? el : null;
}

function renderCanvasProps(p) {
  p.append(h("h3", {}, "キャンバス"));
  const setVb = (i, v) => {
    if (v === "" || isNaN(+v)) return;
    const bg = findBackground();
    doc.vb = doc.vb.map((x, j) => j === i ? +v : x);
    // 背景がキャンバスを覆わなくなったら、背景の大きさも合わせる
    if (bg && !findBackground()) {
      const [x, y, w, hh] = doc.vb;
      Object.entries({ x, y, width: w, height: hh }).forEach(([k, val]) => bg.setAttribute(k, val));
    }
    applyCanvas();
  };
  p.append(
    h("div", { class: "pair" }, row("幅", input(doc.vb[2], v => setVb(2, v), { type: "number", min: "1" })),
      row("高さ", input(doc.vb[3], v => setVb(3, v), { type: "number", min: "1" }))),
    h("div", { class: "pair" }, row("左上 X", input(doc.vb[0], v => setVb(0, v), { type: "number" })),
      row("左上 Y", input(doc.vb[1], v => setVb(1, v), { type: "number" }))));

  const bg = findBackground();
  p.append(h("h4", {}, "背景"));
  if (bg) {
    p.append(row("背景色", colorInput(bg, "fill")));
  } else {
    p.append(h("p", { class: "hint" }, "背景はありません（透明）。"), h("div", { class: "actions" }, h("button", {
      onclick: () => {
        const [x, y, w, hh] = doc.vb;
        const rect = svgEl("rect", { x, y, width: w, height: hh, fill: "#15181C", "data-locked": "1" });
        setComments(rect, ["背景"]);
        content.prepend(rect);
        commit();
        renderProps();
      },
    }, "背景を付ける")));
  }

  const ids = dataIds();
  const dups = duplicateIds();
  p.append(h("h4", {}, `データの要素ID（${ids.length} 個）`));
  if (dups.length) p.append(h("div", { class: "warn" }, `重なっている ID：${dups.slice(0, 8).join("、")}${dups.length > 8 ? " ほか" : ""}`));
  else if (ids.length) p.append(h("div", { class: "ok" }, "ID の重なりはありません"));
  const ta = h("textarea", { readonly: true }, ids.join("\n"));
  p.append(ta, h("div", { class: "actions" }, h("button", {
    onclick: async () => {
      try { await navigator.clipboard.writeText(ids.join("\n")); }
      catch { ta.select(); document.execCommand("copy"); }
      toast("要素ID の一覧をコピーしました（データの表に貼れます）");
    },
  }, "一覧をコピー")));
}

// ---------------------------------------------------------------
// 右の欄：重なり順
// ---------------------------------------------------------------
function layerName(el) {
  if (el.id) return el.id;
  const cm = getComments(el);
  if (cm.length) return cm[cm.length - 1].replace(/^=+\s*|\s*=+$/g, "");
  if (el.localName === "text") return `文字「${el.textContent.trim().slice(0, 12)}」`;
  return kindName(el);
}

// 重なり順の一覧をドラッグで並べ替える。選んでいる行をつかんだら、選んでいるもの全部を動かす
let layerDrag = null;

function dropLayers(target, above) {
  const moving = layerDrag;
  layerDrag = null;
  if (!moving || moving.includes(target)) return;
  // 一覧は上ほど手前（＝SVG では後ろ）なので、行の上に落とすと target の後ろに入る
  above ? target.after(...moving) : target.before(...moving);
  commit();
}

function renderLayers() {
  const list = $("#layerList");
  list.innerHTML = "";
  const clearMarks = () => list.querySelectorAll(".drop-before, .drop-after").forEach(r => r.classList.remove("drop-before", "drop-after"));
  Array.from(content.children).reverse().forEach(el => {
    const locked = isLocked(el);
    const isAbove = (row, e) => e.clientY < row.getBoundingClientRect().top + row.offsetHeight / 2;
    list.append(h("div", {
      class: "layer" + (selection.includes(el) ? " sel" : ""),
      draggable: "true",
      onclick: e => select(e.shiftKey ? (selection.includes(el) ? selection.filter(s => s !== el) : [...selection, el]) : [el]),
      ondragstart: e => {
        layerDrag = Array.from(content.children).filter(c => selection.includes(el) ? selection.includes(c) : c === el);
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", "layer");
        e.currentTarget.classList.add("dragging");
      },
      ondragover: e => {
        if (!layerDrag) return;
        e.preventDefault();
        clearMarks();
        e.currentTarget.classList.add(isAbove(e.currentTarget, e) ? "drop-before" : "drop-after");
      },
      ondragleave: e => e.currentTarget.classList.remove("drop-before", "drop-after"),
      ondrop: e => { e.preventDefault(); dropLayers(el, isAbove(e.currentTarget, e)); },
      ondragend: () => { layerDrag = null; clearMarks(); list.querySelectorAll(".dragging").forEach(r => r.classList.remove("dragging")); },
    },
    h("span", { class: "lname", title: layerName(el) }, layerName(el)),
    icon(h("button", {
      class: "lock" + (locked ? " on" : ""), title: locked ? "ロック中（キャンバスでは選べない）" : "ロックする",
      onclick: e => { e.stopPropagation(); toggleLock(el); },
    }), locked ? ICONS.lock : ICONS.unlock)));
  });
}

// ---------------------------------------------------------------
// 開く・保存
// ---------------------------------------------------------------
function loadSvgText(text, fileName, handle) {
  const d = new DOMParser().parseFromString(text, "image/svg+xml");
  const root = d.documentElement;
  if (root.localName !== "svg" || d.querySelector("parsererror")) { toast("SVG として読めませんでした"); return; }
  const w = parseFloat(root.getAttribute("width")) || 1200, hh = parseFloat(root.getAttribute("height")) || 700;
  const vb = (root.getAttribute("viewBox") || `0 0 ${w} ${hh}`).trim().split(/[\s,]+/).map(Number);
  const rootAttrs = {};
  Array.from(root.attributes).forEach(a => {
    if (!["viewBox", "width", "height", "xmlns", "style"].includes(a.name)) rootAttrs[a.name] = a.value;
  });

  content.innerHTML = "";
  let header = null, pending = [], seenElement = false;
  root.childNodes.forEach(n => {
    if (n.nodeType === Node.COMMENT_NODE) {
      if (!seenElement && header === null && n.data.includes("\n")) header = n.data;
      else pending.push(n.data.trim());
    } else if (n.nodeType === Node.ELEMENT_NODE) {
      seenElement = true;
      const el = document.importNode(n, true);
      setComments(el, pending);
      pending = [];
      content.append(el);
    }
  });

  doc.vb = vb.length === 4 ? vb : [0, 0, w, hh];
  doc.header = header;
  doc.rootAttrs = { ...DEFAULT_ROOT_ATTRS, ...rootAttrs };
  doc.fileName = fileName;
  doc.handle = handle || null;

  // 全体を覆う背景の四角はロックしておく（うっかり動かさないように）
  const first = content.firstElementChild;
  if (first && first.localName === "rect" && +first.getAttribute("width") >= doc.vb[2] && +first.getAttribute("height") >= doc.vb[3]) {
    first.setAttribute("data-locked", "1");
  }
  applyCanvas();
  select([]);
  resetHistory();
  fitZoom();
  toast(`${fileName} を開きました`);
}

function newDocument() {
  content.innerHTML = "";
  const bg = svgEl("rect", { width: 1200, height: 700, fill: "#15181C", "data-locked": "1" });
  setComments(bg, ["背景"]);
  content.append(bg);
  Object.assign(doc, { vb: [0, 0, 1200, 700], header: DEFAULT_HEADER, rootAttrs: { ...DEFAULT_ROOT_ATTRS }, fileName: "monitor.svg", handle: null });
  applyCanvas();
  select([]);
  resetHistory();
  fitZoom();
}

function serializeNode(n, depth) {
  const pad = "  ".repeat(depth);
  if (n.nodeType === Node.COMMENT_NODE) return [`${pad}<!--${n.data}-->`];
  if (n.nodeType !== Node.ELEMENT_NODE) return [];
  const attrs = Array.from(n.attributes)
    .filter(a => !EDITOR_ATTRS.includes(a.name) && a.name !== "xmlns")
    .map(a => ` ${a.name}="${escXml(a.value)}"`).join("");
  const kids = Array.from(n.childNodes);
  const elKids = kids.filter(k => k.nodeType === Node.ELEMENT_NODE || k.nodeType === Node.COMMENT_NODE);
  const text = kids.filter(k => k.nodeType === Node.TEXT_NODE).map(k => k.data).join("");
  if (!elKids.length) {
    return text.trim() ? [`${pad}<${n.localName}${attrs}>${escXml(text)}</${n.localName}>`] : [`${pad}<${n.localName}${attrs}/>`];
  }
  if (text.trim()) {
    // 文字と tspan が混ざっているものはそのまま書く
    const raw = new XMLSerializer().serializeToString(n).replace(/ xmlns="[^"]*"/g, "").replace(/ data-(comments|locked)="[^"]*"/g, "");
    return [pad + raw];
  }
  return [`${pad}<${n.localName}${attrs}>`, ...elKids.flatMap(k => serializeNode(k, depth + 1)), `${pad}</${n.localName}>`];
}

function serialize() {
  const [, , w, hh] = doc.vb;
  const extra = Object.entries(doc.rootAttrs).map(([k, v]) => ` ${k}="${escXml(v)}"`).join("");
  const lines = [`<svg xmlns="${NS}" viewBox="${doc.vb.join(" ")}" width="${w}" height="${hh}"${extra}>`];
  if (doc.header) lines.push(`  <!--${doc.header}-->`);
  Array.from(content.children).forEach(el => {
    getComments(el).forEach(c => {
      if (/^=/.test(c)) lines.push("");
      lines.push(`  <!-- ${c} -->`);
    });
    lines.push(...serializeNode(el, 1));
  });
  lines.push("</svg>", "");
  return lines.join("\n");
}

function checkBeforeSave() {
  const dups = duplicateIds();
  return !dups.length || confirm(`ID が重なっています：\n${dups.slice(0, 10).join("\n")}\n\nこのまま保存しますか？`);
}

async function save(as) {
  if (!checkBeforeSave()) return;
  const text = serialize();
  try {
    if (!as && doc.handle) {
      await writeHandle(doc.handle, text);
      toast(`${doc.fileName} に保存しました`);
      return;
    }
    if (window.showSaveFilePicker) {
      const handle = await showSaveFilePicker({ suggestedName: doc.fileName, types: [{ description: "SVG", accept: { "image/svg+xml": [".svg"] } }] });
      await writeHandle(handle, text);
      doc.handle = handle;
      doc.fileName = handle.name;
      applyCanvas();
      saveDraft();
      toast(`${doc.fileName} に保存しました`);
      return;
    }
  } catch (err) {
    if (err.name === "AbortError") return;
    toast("保存できなかったので、ダウンロードします");
  }
  const a = h("a", { href: URL.createObjectURL(new Blob([text], { type: "image/svg+xml" })), download: doc.fileName });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function writeHandle(handle, text) {
  const w = await handle.createWritable();
  await w.write(text);
  await w.close();
}

async function openFile() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await showOpenFilePicker({ types: [{ description: "SVG", accept: { "image/svg+xml": [".svg"] } }] });
      const file = await handle.getFile();
      loadSvgText(await file.text(), file.name, handle);
    } catch (err) {
      if (err.name !== "AbortError") toast("開けませんでした：" + err.message);
    }
    return;
  }
  $("#fileOpen").click();
}

$("#fileOpen").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (f) loadSvgText(await f.text(), f.name, null);
  e.target.value = "";
});
$("#filePart").addEventListener("change", async e => {
  for (const f of e.target.files) loadPartFile(await f.text(), f.name);
  e.target.value = "";
});

// ---------------------------------------------------------------
// ボタンとキー
// ---------------------------------------------------------------
$("#btnNew").onclick = () => { if (confirm("今の内容を消して、新しく始めますか？")) newDocument(); };
$("#btnOpen").onclick = openFile;
$("#btnSave").onclick = () => save(false);
$("#btnSaveAs").onclick = () => save(true);
$("#btnUndo").onclick = undo;
$("#btnRedo").onclick = redo;
$("#btnDelete").onclick = deleteSelection;
$("#addPart").onclick = () => $("#filePart").click();
$("#zoomIn").onclick = () => setZoom(zoom * 1.25);
$("#zoomOut").onclick = () => setZoom(zoom / 1.25);
$("#zoomFit").onclick = fitZoom;
$("#gridSelect").onchange = e => { grid = +e.target.value; applyCanvas(); };
document.querySelectorAll(".tool[data-tool]").forEach(b => b.onclick = () => toggleTool(b.dataset.tool));

// スポイトは、もう一度押すと終わって選択に戻る
function toggleTool(t) {
  setTool(t === "pick" && tool === "pick" ? "select" : t);
}
document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === b));
  document.querySelectorAll(".panel").forEach(p => p.hidden = p.id !== b.dataset.tab);
});

// 倍率の手入力（「150」でも「150%」でも可。Enter で決定、Esc で取り消し）
const zoomInput = $("#zoomLabel");
const showZoom = () => zoomInput.value = Math.round(zoom * 100) + "%";
zoomInput.addEventListener("focus", () => zoomInput.select());
zoomInput.addEventListener("change", () => {
  const v = parseFloat(zoomInput.value.replace(/[%％\s]/g, "").replace(/[０-９．]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)));
  if (v > 0) setZoom(v / 100);
  showZoom();
});
zoomInput.addEventListener("keydown", e => {
  if (e.key === "Enter") zoomInput.blur();
  if (e.key === "Escape") { showZoom(); zoomInput.blur(); }
});
zoomInput.addEventListener("blur", showZoom);

// オプション：選択したときの色
renderSelColors();
$("#selColorPick").addEventListener("input", e => setSelColor(e.target.value));

// 拡大の道具で Alt を押しているあいだは縮小：カーソルと画面下のボタンも縮小にする
let altHeld = false;
const ZOOM_ICONS = {
  in: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M11 8v6M8 11h6"/>',
  out: '<circle cx="11" cy="11" r="7"/><path d="m20 20-4-4M8 11h6"/>',
};

function updateZoomMode() {
  const out = tool === "zoom" && altHeld;
  if (tool === "zoom") canvas.setAttribute("class", out ? "cur-zoom-out" : "cur-zoom");
  const btn = $("#zoomToolBtn");
  btn.querySelector("svg").innerHTML = out ? ZOOM_ICONS.out : ZOOM_ICONS.in;
  $("#zoomToolLabel").textContent = out ? "縮小" : "拡大";
}

function setAltHeld(on) {
  if (altHeld === on) return;
  altHeld = on;
  updateZoomMode();
}

window.addEventListener("keydown", e => {
  if (e.key !== "Alt") return;
  if (tool === "zoom") e.preventDefault(); // Alt だけ押したときに、ブラウザのメニューへ移らないように
  setAltHeld(true);
});
window.addEventListener("keyup", e => {
  if (e.key !== "Alt") return;
  if (tool === "zoom") e.preventDefault();
  setAltHeld(false);
});
// ほかの画面に移ったときや、Alt を離したのを取りこぼしたときにも合わせる
window.addEventListener("blur", () => setAltHeld(false));
canvas.addEventListener("pointermove", e => setAltHeld(e.altKey));

const TOOL_KEYS = { v: "select", l: "line", r: "rect", o: "ellipse", t: "text", i: "pick", z: "zoom" };

window.addEventListener("keydown", e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && e.key.toLowerCase() === "s") { e.preventDefault(); save(e.shiftKey); return; }
  if (typing) return;
  if (ctrl && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); return; }
  if (ctrl && e.key.toLowerCase() === "d") { e.preventDefault(); duplicateSelection(); return; }
  if (ctrl && e.key.toLowerCase() === "c") { e.preventDefault(); copySelection(); return; }
  if (ctrl && e.key.toLowerCase() === "x") { e.preventDefault(); cutSelection(); return; }
  if (ctrl && e.key.toLowerCase() === "v") { e.preventDefault(); pasteClipboard(); return; }
  if (ctrl && e.key.toLowerCase() === "a") { e.preventDefault(); select(Array.from(content.children).filter(el => !isLocked(el))); return; }
  if (ctrl) return;
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSelection(); return; }
  if (e.key === "Escape") {
    if (tool === "line" && linePts.length) { linePts = []; overlayTmp.innerHTML = ""; return; }
    if (tool !== "select") { setTool("select"); return; }
    select([]);
    return;
  }
  if (e.key === "Enter" && tool === "line") { finishLine(); return; }
  const arrows = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  if (arrows[e.key] && selection.length) {
    e.preventDefault();
    const step = e.shiftKey ? (grid || 10) : 1;
    nudge(arrows[e.key][0] * step, arrows[e.key][1] * step);
    return;
  }
  if (e.key === "]") { reorder("forward"); return; }
  if (e.key === "[") { reorder("backward"); return; }
  const t = TOOL_KEYS[e.key.toLowerCase()];
  if (t) toggleTool(t);
});

window.addEventListener("beforeunload", saveDraft);
window.addEventListener("resize", fitToolbar);

// ---------------------------------------------------------------
// はじめ
// ---------------------------------------------------------------
parts = BUILTIN_PARTS.map(d => makePart(d));
try {
  JSON.parse(localStorage.getItem(PARTS_KEY) || "[]").forEach(d => { const p = makePart(d, true); if (p) parts.push(p); });
} catch { /* 読めなければ組み込みの部品だけ */ }

renderPalette();
setColor("fill", fillColor);
setColor("stroke", strokeColor);
setTool("select");

let restored = false;
try {
  const draft = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
  if (draft && draft.snap) {
    restore(draft.snap);
    doc.fileName = draft.fileName || doc.fileName;
    resetHistory();
    restored = true;
  }
} catch { /* 下書きが読めなければ新規 */ }
if (!restored) newDocument();
applyCanvas();
requestAnimationFrame(fitZoom);
if (restored) toast("前回の続きを開きました（ファイルに保存するには「保存」）");
</script>
</body>
</html>
